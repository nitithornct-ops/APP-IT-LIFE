<!-- Assurance.html — Problem, Vulnerability และ Audit -->
<script>
var AS_DATA={};
function asHead_(title,sub,button){return '<div class="d-flex justify-content-between align-items-center mb-3"><div><h3 class="text-primary mb-1">'+title+'</h3><div class="text-muted">'+sub+'</div></div>'+button+'</div>';}
function asEmpty_(text){return '<div class="alert alert-secondary">'+text+'</div>';}

function renderProblem(c){c.innerHTML='กำลังโหลด...';return callServer('getProblemModuleData').then(function(d){AS_DATA.problem=d;var open=d.problems.filter(function(x){return x.status!=='ปิด';}).length;c.innerHTML=asHead_('Problem / Known Error','RCA · Workaround · Permanent fix · เชื่อม Ticket/Incident/KB',d.canEdit?'<div><button class="btn btn-primary me-1" onclick="asProblemForm_()">เพิ่ม Problem</button><button class="btn btn-outline-primary" onclick="asKnownForm_()">เพิ่ม Known Error</button></div>':'')+moduleDashboard([mdStat('Problem',d.problems.length,'bi-bug','blue'),mdStat('ยังเปิด',open,'bi-hourglass','amber'),mdStat('Known Error',d.knownErrors.length,'bi-journal-code','teal')])+'<h5>Problems</h5>'+asProblemTable_(d)+'<h5 class="mt-4">Known Error Database</h5>'+asKnownTable_(d);});}
function asProblemTable_(d){if(!d.problems.length)return asEmpty_('ยังไม่มี Problem');var b=d.problems.map(function(r){return '<tr><td>'+r.id+'</td><td><b>'+escapeHtmlJs(r.title)+'</b><div class="small text-muted">'+escapeHtmlJs(r.system||'')+'</div></td><td>'+escapeHtmlJs(r.incidents||'-')+'</td><td>'+escapeHtmlJs(r.tickets||'-')+'</td><td>'+escapeHtmlJs(r.owner||'-')+'</td><td>'+escapeHtmlJs(r.status)+'</td><td>'+(d.canEdit?'<button class="btn btn-sm btn-outline-secondary" onclick="asProblemForm_(\''+r.id+'\')">แก้ไข</button>':'')+'</td></tr>';}).join('');return tableWrap('<tr><th>ID</th><th>ปัญหา</th><th>Incidents</th><th>Tickets</th><th>Owner</th><th>สถานะ</th><th></th></tr>',b);}
function asKnownTable_(d){if(!d.knownErrors.length)return asEmpty_('ยังไม่มี Known Error');var b=d.knownErrors.map(function(r){return '<tr><td>'+r.id+'</td><td>'+r.problemId+'</td><td><b>'+escapeHtmlJs(r.title)+'</b><div class="small">'+escapeHtmlJs(r.symptoms||'')+'</div></td><td>'+escapeHtmlJs(r.workaround)+'</td><td>'+escapeHtmlJs(r.kb||'-')+'</td><td>'+escapeHtmlJs(r.status)+'</td></tr>';}).join('');return tableWrap('<tr><th>ID</th><th>Problem</th><th>อาการ</th><th>Workaround</th><th>KB</th><th>สถานะ</th></tr>',b);}
function asProblemForm_(id){var d=AS_DATA.problem,r=d.problems.filter(function(x){return x.id===id;})[0]||{};showFormModal({title:id?'แก้ไข Problem':'เพิ่ม Problem',submitLabel:'บันทึก',fields:[{id:'title',label:'ชื่อปัญหา',value:r.title||'',required:true,col:'col-md-6'},{id:'category',label:'หมวด',value:r.category||'',col:'col-md-3'},{id:'affectedSystem',label:'ระบบ',value:r.system||'',col:'col-md-3'},{id:'relatedIncidentIds',label:'Incident IDs (คั่น comma)',value:r.incidents||'',col:'col-md-6'},{id:'relatedTicketIds',label:'Ticket IDs (คั่น comma)',value:r.tickets||'',col:'col-md-6'},{id:'impact',label:'ผลกระทบ',type:'textarea',value:r.impact||'',col:'col-md-6'},{id:'rootCause',label:'Root Cause',type:'textarea',value:r.rootCause||'',col:'col-md-6'},{id:'workaround',label:'Workaround',type:'textarea',value:r.workaround||'',col:'col-md-6'},{id:'permanentFix',label:'Permanent Fix',type:'textarea',value:r.fix||'',col:'col-md-6'},{id:'owner',label:'Owner',value:r.owner||'',col:'col-md-4'},{id:'priority',label:'Priority',type:'select',options:['ต่ำ','ปานกลาง','สูง','วิกฤต'],value:r.priority||'ปานกลาง',placeholder:false,col:'col-md-4'},{id:'status',label:'สถานะ',type:'select',options:d.statuses,value:r.status||'เปิด',placeholder:false,col:'col-md-4'}],onSubmit:function(v){v.id=id||'';return callServer('saveProblemRecord',v).then(function(){toast('บันทึกแล้ว');loadModule('problem');});}});}
function asKnownForm_(){var d=AS_DATA.problem;showFormModal({title:'เพิ่ม Known Error',submitLabel:'บันทึก',fields:[{id:'problemId',label:'Problem ID',required:true,col:'col-md-3'},{id:'title',label:'ชื่อ Known Error',required:true,col:'col-md-9'},{id:'symptoms',label:'อาการ',type:'textarea',col:'col-md-6'},{id:'rootCause',label:'Root Cause',type:'textarea',col:'col-md-6'},{id:'workaround',label:'Workaround',type:'textarea',required:true,col:'col-md-8'},{id:'knowledgeArticleId',label:'KB Article ID',col:'col-md-4'},{id:'affectedVersions',label:'Affected versions',col:'col-md-4'},{id:'fixedVersion',label:'Fixed version',col:'col-md-4'},{id:'status',label:'สถานะ',type:'select',options:['ร่าง','เผยแพร่','แก้ไขแล้ว','ยกเลิก'],value:'เผยแพร่',placeholder:false,col:'col-md-4'}],onSubmit:function(v){return callServer('saveKnownErrorRecord',v).then(function(){toast('บันทึกแล้ว');loadModule('problem');});}});}

function renderVulnerability(c){c.innerHTML='กำลังโหลด...';return callServer('getVulnerabilityModuleData').then(function(d){AS_DATA.vulnerability=d;var over=d.findings.filter(function(x){return x.dueDays!==null&&x.dueDays<0&&x.status!=='ปิด';}).length;c.innerHTML=asHead_('Vulnerability / Patch','CVE · CVSS · Remediation · Exception · Verification',d.canEdit?'<button class="btn btn-primary" onclick="asVulnForm_()">เพิ่มช่องโหว่</button>':'')+moduleDashboard([mdStat('ทั้งหมด',d.findings.length,'bi-shield-exclamation','blue'),mdStat('เกินกำหนด',over,'bi-alarm','danger')])+asVulnTable_(d);});}
function asVulnTable_(d){if(!d.findings.length)return asEmpty_('ยังไม่มีช่องโหว่');var b=d.findings.map(function(r){var due=r.dueDays<0&&r.status!=='ปิด'?'<span class="overdue">'+r.dueDate+'</span>':(r.dueDate||'-');return '<tr><td>'+r.id+'</td><td><b>'+escapeHtmlJs(r.title)+'</b><div class="small">'+escapeHtmlJs(r.cve||'')+'</div></td><td>'+escapeHtmlJs(String(r.cvss||'-'))+' / '+escapeHtmlJs(r.severity)+'</td><td>'+escapeHtmlJs(r.assetId||r.system||'-')+'</td><td>'+escapeHtmlJs(r.owner||'-')+'</td><td>'+due+'</td><td>'+escapeHtmlJs(r.status)+'</td><td>'+(d.canEdit?'<button class="btn btn-sm btn-outline-secondary" onclick="asVulnForm_(\''+r.id+'\')">แก้ไข</button> <button class="btn btn-sm btn-outline-success" onclick="asVulnStatus_(\''+r.id+'\')">สถานะ</button>':'')+'</td></tr>';}).join('');return tableWrap('<tr><th>ID</th><th>ช่องโหว่</th><th>คะแนน</th><th>Asset/System</th><th>Owner</th><th>Due</th><th>สถานะ</th><th></th></tr>',b);}
function asVulnForm_(id){var d=AS_DATA.vulnerability,r=d.findings.filter(function(x){return x.id===id;})[0]||{};showFormModal({title:id?'แก้ไขช่องโหว่':'เพิ่มช่องโหว่',submitLabel:'บันทึก',fields:[{id:'title',label:'ชื่อช่องโหว่',value:r.title||'',required:true,col:'col-md-6'},{id:'cve',label:'CVE',value:r.cve||'',col:'col-md-2'},{id:'cvss',label:'CVSS 0-10',type:'number',value:r.cvss||'',col:'col-md-2'},{id:'severity',label:'Severity',type:'select',options:['ต่ำ','ปานกลาง','สูง','วิกฤต'],value:r.severity||'ปานกลาง',placeholder:false,required:true,col:'col-md-2'},{id:'assetId',label:'Asset ID',value:r.assetId||'',col:'col-md-3'},{id:'affectedSystem',label:'ระบบ',value:r.system||'',col:'col-md-3'},{id:'source',label:'แหล่งตรวจพบ',value:r.source||'',col:'col-md-3'},{id:'owner',label:'Owner',value:r.owner||'',col:'col-md-3'},{id:'description',label:'รายละเอียด',type:'textarea',value:r.description||'',col:'col-md-6'},{id:'remediationPlan',label:'แผนแก้ไข',type:'textarea',value:r.plan||'',col:'col-md-6'},{id:'dueDate',label:'กำหนดเสร็จ',type:'date',col:'col-md-3'},{id:'status',label:'สถานะ',type:'select',options:d.statuses,value:r.status||'เปิด',placeholder:false,col:'col-md-3'},{id:'exceptionReason',label:'เหตุผลข้อยกเว้น',value:r.exception||'',col:'col-md-6'}],onSubmit:function(v){v.id=id||'';return callServer('saveVulnerabilityFinding',v).then(function(){toast('บันทึกแล้ว');loadModule('vulnerability');});}});}
function asVulnStatus_(id){showFormModal({title:'อัปเดต/ตรวจยืนยันช่องโหว่',submitLabel:'บันทึก',fields:[{id:'status',label:'สถานะ',type:'select',options:AS_DATA.vulnerability.statuses,required:true},{id:'evidence',label:'HTTPS Evidence URL'}],onSubmit:function(v){return callServer('updateVulnerabilityStatus',id,v.status,v.evidence||'').then(function(){toast('อัปเดตแล้ว');loadModule('vulnerability');});}});}

function renderAudit(c){c.innerHTML='กำลังโหลด...';return callServer('getAuditModuleData').then(function(d){AS_DATA.audit=d;var open=d.findings.filter(function(x){return x.status!=='ปิด';}).length;c.innerHTML=asHead_('Audit Management','Engagement · Finding · Corrective action · Independent verification',d.canEdit?'<div><button class="btn btn-primary me-1" onclick="asAuditForm_()">เพิ่มงานตรวจ</button><button class="btn btn-outline-primary" onclick="asFindingForm_()">เพิ่มข้อตรวจพบ</button></div>':'')+moduleDashboard([mdStat('งานตรวจ',d.audits.length,'bi-clipboard2-check','blue'),mdStat('ข้อตรวจพบเปิด',open,'bi-exclamation-diamond','amber')])+'<h5>Audit Engagements</h5>'+asAuditTable_(d)+'<h5 class="mt-4">Audit Findings</h5>'+asFindingTable_(d);});}
function asAuditTable_(d){if(!d.audits.length)return asEmpty_('ยังไม่มีงานตรวจ');return tableWrap('<tr><th>ID</th><th>งานตรวจ</th><th>ประเภท</th><th>Lead</th><th>ช่วงเวลา</th><th>สถานะ</th></tr>',d.audits.map(function(r){return '<tr><td>'+r.id+'</td><td><b>'+escapeHtmlJs(r.title)+'</b><div class="small">'+escapeHtmlJs(r.scope)+'</div></td><td>'+escapeHtmlJs(r.type||'-')+'</td><td>'+escapeHtmlJs(r.lead||'-')+'</td><td>'+escapeHtmlJs(r.start||'-')+' - '+escapeHtmlJs(r.end||'-')+'</td><td>'+escapeHtmlJs(r.status)+'</td></tr>';}).join(''));}
function asFindingTable_(d){if(!d.findings.length)return asEmpty_('ยังไม่มีข้อตรวจพบ');return tableWrap('<tr><th>ID</th><th>Audit</th><th>ข้อตรวจพบ</th><th>ประเภท</th><th>Owner</th><th>Due</th><th>สถานะ</th><th></th></tr>',d.findings.map(function(r){return '<tr><td>'+r.id+'</td><td>'+r.auditId+'</td><td>'+escapeHtmlJs(r.title)+'</td><td>'+escapeHtmlJs(r.type||'-')+'</td><td>'+escapeHtmlJs(r.owner||'-')+'</td><td>'+escapeHtmlJs(r.dueDate||'-')+'</td><td>'+escapeHtmlJs(r.status)+'</td><td>'+(d.canEdit?'<button class="btn btn-sm btn-outline-success" onclick="asFindingStatus_(\''+r.id+'\')">สถานะ</button>':'')+'</td></tr>';}).join(''));}
function asAuditForm_(){showFormModal({title:'เพิ่มงานตรวจ',submitLabel:'บันทึก',fields:[{id:'title',label:'ชื่องานตรวจ',required:true,col:'col-md-6'},{id:'auditType',label:'ประเภท',type:'select',options:['Internal Audit','External Audit','Compliance Review','Supplier Audit'],col:'col-md-3'},{id:'leadAuditor',label:'Lead Auditor',col:'col-md-3'},{id:'scope',label:'ขอบเขต',type:'textarea',required:true,col:'col-md-6'},{id:'criteria',label:'เกณฑ์/ข้อกำหนด',type:'textarea',col:'col-md-6'},{id:'auditee',label:'หน่วยรับตรวจ',col:'col-md-4'},{id:'plannedStart',label:'เริ่ม',type:'date',col:'col-md-2'},{id:'plannedEnd',label:'สิ้นสุด',type:'date',col:'col-md-2'},{id:'status',label:'สถานะ',type:'select',options:AS_DATA.audit.statuses,value:'เปิด',placeholder:false,col:'col-md-4'}],onSubmit:function(v){return callServer('saveAuditEngagement',v).then(function(){toast('บันทึกแล้ว');loadModule('audit');});}});}
function asFindingForm_(){showFormModal({title:'เพิ่มข้อตรวจพบ',submitLabel:'บันทึก',fields:[{id:'auditId',label:'Audit ID',required:true,col:'col-md-3'},{id:'title',label:'ชื่อข้อตรวจพบ',required:true,col:'col-md-6'},{id:'findingType',label:'ประเภท',type:'select',options:['Major NC','Minor NC','Observation','Opportunity'],col:'col-md-3'},{id:'requirement',label:'ข้อกำหนด',type:'textarea',col:'col-md-6'},{id:'evidence',label:'หลักฐานที่ตรวจพบ',type:'textarea',col:'col-md-6'},{id:'rootCause',label:'Root Cause',type:'textarea',col:'col-md-6'},{id:'actionPlan',label:'แผนแก้ไข',type:'textarea',col:'col-md-6'},{id:'owner',label:'Owner',col:'col-md-4'},{id:'dueDate',label:'Due date',type:'date',col:'col-md-4'},{id:'status',label:'สถานะ',type:'select',options:AS_DATA.audit.statuses,value:'เปิด',placeholder:false,col:'col-md-4'}],onSubmit:function(v){return callServer('saveAuditFinding',v).then(function(){toast('บันทึกแล้ว');loadModule('audit');});}});}
function asFindingStatus_(id){showFormModal({title:'อัปเดต/ตรวจยืนยันข้อตรวจพบ',submitLabel:'บันทึก',fields:[{id:'status',label:'สถานะ',type:'select',options:AS_DATA.audit.statuses,required:true},{id:'evidence',label:'HTTPS Evidence URL'}],onSubmit:function(v){return callServer('updateAuditFindingStatus',id,v.status,v.evidence||'').then(function(){toast('อัปเดตแล้ว');loadModule('audit');});}});}
</script>
