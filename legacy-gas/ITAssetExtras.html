<!-- ITAssetExtras.html — โมดูล IT Asset เพิ่มเติม + Reports/Users/Settings/Tester -->
<script>
  function optList(list) {
    return (list || []).map(function (x) { return '<option>' + escapeHtmlJs(x) + '</option>'; }).join('');
  }
  function optAssets(list) {
    return (list || []).map(function (a) {
      return '<option value="' + escapeHtmlJs(a.id) + '">' + escapeHtmlJs(a.label || (a.id + ' - ' + a.name)) + '</option>';
    }).join('');
  }
  function optPairs(list, valueKey, labelKey) {
    return (list || []).map(function (r) {
      return '<option value="' + escapeHtmlJs(r[valueKey]) + '">' + escapeHtmlJs(r[labelKey] || r[valueKey]) + '</option>';
    }).join('');
  }
  function selectedOptionText(id) {
    var el = document.getElementById(id);
    if (!el || el.selectedIndex < 0) return '';
    var text = el.options[el.selectedIndex].text;
    var marker = text.indexOf(' - ');
    return marker > -1 ? text.substring(marker + 3) : text;
  }
  function itBadgeTone(text) {
    var s = String(text || '').toLowerCase();
    if (s.indexOf('fail') > -1 || s.indexOf('หมด') > -1 || s.indexOf('ยกเลิก') > -1 || s.indexOf('inactive') > -1) return 'danger';
    if (s.indexOf('warn') > -1 || s.indexOf('block') > -1 || s.indexOf('รอ') > -1 || s.indexOf('กำลัง') > -1) return 'warning text-dark';
    if (s.indexOf('info') > -1) return 'secondary';
    if (s.indexOf('pass') > -1 || s.indexOf('active') > -1 || s.indexOf('เสร็จ') > -1 || s.indexOf('ปิด') > -1) return 'success';
    return 'secondary';
  }
  function itStatusBadge(text) {
    return '<span class="badge bg-' + itBadgeTone(text) + '">' + escapeHtmlJs(text || '-') + '</span>';
  }

  // ===== Borrow / Return / Transfer =====
  var BORROW_DATA = null;
  var BR_CONTAINER = null;
  var BR_CHARTS = [];
  var BR_ACTION_FN = { assign: 'assignAsset', return: 'returnAsset', transfer: 'transferAsset', repair: 'sendAssetToRepair', repairReturn: 'returnAssetFromRepair' };

  function renderBorrow(container) {
    BR_CONTAINER = container;
    container.innerHTML = '<div class="text-center text-muted py-5">กำลังโหลด...</div>';
    callServer('getBorrowModuleData').then(function (d) {
      BORROW_DATA = d;
      var s = d.summary;
      var html = '<div class="d-flex align-items-center flex-wrap gap-2 mb-3"><h3 class="text-primary mb-0">ยืม / คืน / โอนย้าย Asset</h3>';
      html += '<div class="ms-auto d-flex flex-wrap gap-2">';
      if (d.canViewAnalytics) html += '<button class="btn btn-outline-primary" onclick="brShowAnalytics()"><i class="bi bi-graph-up"></i> วิเคราะห์ผล</button>';
      if (d.canEdit) html += '<button class="btn btn-primary" onclick="brOpenForm()"><i class="bi bi-plus-lg"></i> บันทึกการเคลื่อนไหว</button>';
      html += '</div></div>';
      html += moduleDashboard([
        mdStat('พร้อมให้ยืม', s.available, 'bi-check-circle', 'teal'),
        mdStat('กำลังถือครอง', s.onLoan, 'bi-person-badge', s.onLoan ? 'blue' : 'gray'),
        mdStat('ใกล้ครบกำหนดคืน', s.dueSoon, 'bi-calendar-event', s.dueSoon ? 'amber' : 'gray'),
        mdStat('ค้างคืน (เกินกำหนด)', s.overdue, 'bi-alarm', s.overdue ? 'danger' : 'teal')
      ]);
      html += '<ul class="nav nav-tabs mb-3">' +
        '<li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#br-onloan" type="button">กำลังถือครอง / ค้างคืน (' + (d.onLoan || []).length + ')</button></li>' +
        '<li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#br-history" type="button">ประวัติเคลื่อนไหว</button></li>' +
        '</ul><div class="tab-content">' +
        '<div class="tab-pane fade show active" id="br-onloan">' + dataTable(brOnLoanCfg(d)) + '</div>' +
        '<div class="tab-pane fade" id="br-history">' + dataTable(brHistoryCfg(d)) + '</div></div>';
      container.innerHTML = html;
    });
  }

  function brDueHtml(r) {
    if (!r.hasDue) return '<small class="text-muted">ไม่กำหนดคืน</small>';
    if (r.dueDays === null) return escapeHtmlJs(r.loanDue || '-');
    if (r.dueDays < 0) return '<span class="overdue">เกิน ' + Math.abs(r.dueDays) + ' วัน</span><br><small class="text-muted">' + escapeHtmlJs(r.loanDue) + '</small>';
    if (r.dueDays <= 7) return '<span class="soon">อีก ' + r.dueDays + ' วัน</span><br><small class="text-muted">' + escapeHtmlJs(r.loanDue) + '</small>';
    return '<small>' + escapeHtmlJs(r.loanDue) + '</small>';
  }
  function brOnLoanCfg(d) {
    return {
      id: 'brOnLoan', rows: d.onLoan || [], empty: 'ไม่มีทรัพย์สินที่ถูกยืม/ถือครองอยู่',
      columns: [
        { key: 'asset', label: 'Asset', value: function (r) { return '<b>' + escapeHtmlJs(r.code || r.id) + '</b><br><small class="text-muted">' + escapeHtmlJs(r.name || '') + '</small>'; }, raw: function (r) { return (r.code || '') + ' ' + (r.name || ''); } },
        { key: 'borrower', label: 'ผู้ถือครอง', value: function (r) { return escapeHtmlJs(r.borrower || '-') + '<br><small class="text-muted">' + escapeHtmlJs(r.department || '') + '</small>'; }, raw: function (r) { return (r.borrower || '') + ' ' + (r.department || ''); } },
        { key: 'location', label: 'สถานที่', value: function (r) { return escapeHtmlJs(r.location || '-'); }, default: false },
        { key: 'loanDate', label: 'ยืมเมื่อ', value: function (r) { return escapeHtmlJs(r.loanDate || '-'); } },
        { key: 'due', label: 'กำหนดคืน', value: brDueHtml, raw: function (r) { return r.loanDue || ''; } }
      ],
      filters: [{ key: 'department', label: 'แผนก', value: function (r) { return r.department || ''; } }],
      actions: d.canEdit ? function (r) {
        return '<button class="btn btn-sm btn-success me-1 mb-1" onclick="brReturn(\'' + r.id + '\')"><i class="bi bi-box-arrow-in-left"></i> รับคืน</button>' +
          '<button class="btn btn-sm btn-outline-dark mb-1" onclick="brPrintSlip(\'' + r.id + '\')"><i class="bi bi-printer"></i> ใบยืม</button>';
      } : null,
      actionsLabel: ''
    };
  }
  function brHistoryCfg(d) {
    return {
      id: 'borrow', rows: d.movements, empty: 'ยังไม่มีประวัติการเคลื่อนไหว Asset',
      columns: [
        { key: 'date', label: 'วันที่', value: function (r) { return escapeHtmlJs(r.actionDate || '-'); } },
        { key: 'asset', label: 'Asset', value: function (r) { return escapeHtmlJs(r.assetName || r.assetId); }, raw: function (r) { return (r.assetName || '') + ' ' + (r.assetId || ''); } },
        { key: 'action', label: 'การดำเนินการ', value: function (r) { return itStatusBadge(r.action); }, raw: function (r) { return r.action; } },
        { key: 'fromto', label: 'จาก → ถึง', value: function (r) { return escapeHtmlJs(r.fromUser || '-') + ' → ' + escapeHtmlJs(r.toUser || '-'); }, raw: function (r) { return (r.fromUser || '') + ' ' + (r.toUser || ''); } },
        { key: 'due', label: 'กำหนดคืน', value: function (r) { return escapeHtmlJs(r.dueDate || '-'); }, default: false },
        { key: 'location', label: 'สถานที่', value: function (r) { return escapeHtmlJs(r.location || '-'); } },
        { key: 'notes', label: 'หมายเหตุ', value: function (r) { return '<small>' + escapeHtmlJs(r.notes || '') + (r.condition ? '<br>สภาพ: ' + escapeHtmlJs(r.condition) : '') + (r.evidence ? ' <a href="' + escapeHtmlJs(r.evidence) + '" target="_blank">หลักฐาน</a>' : '') + '</small>'; }, raw: function (r) { return r.notes || ''; } }
      ],
      filters: [{ key: 'action', label: 'การดำเนินการ', value: function (r) { return r.action || ''; } }]
    };
  }

  function brOpenForm(preAction) {
    var d = BORROW_DATA;
    showFormModal({
      title: 'บันทึกการเคลื่อนไหว Asset', submitLabel: 'บันทึก',
      fields: [
        { id: 'action', label: 'การดำเนินการ', type: 'select', placeholder: false, required: true, value: preAction || 'assign', col: 'col-md-4',
          options: [{ value: 'assign', label: 'ยืม/มอบหมาย' }, { value: 'return', label: 'คืน' }, { value: 'transfer', label: 'โอนย้าย' }, { value: 'repair', label: 'ส่งซ่อม' }, { value: 'repairReturn', label: 'รับคืนจากซ่อม' }] },
        { id: 'assetId', label: 'Asset', type: 'select', required: true, col: 'col-md-8',
          options: (d.assets || []).map(function (a) { return { value: a.id, label: a.label || a.id }; }) },
        { id: 'toUser', label: 'ผู้รับ/ผู้ถือครอง (หรือชื่อร้านซ่อม)', col: 'col-md-6' },
        { id: 'toEmail', label: 'อีเมลผู้รับ', type: 'email', col: 'col-md-6' },
        { id: 'dueDate', label: 'กำหนดคืน (กรณียืม/โอนย้าย)', type: 'date', col: 'col-md-4' },
        { id: 'department', label: 'แผนก', col: 'col-md-4' },
        { id: 'location', label: 'สถานที่', col: 'col-md-4' },
        { id: 'condition', label: 'สภาพตอนคืน (กรณีคืน)', col: 'col-md-8' },
        { id: 'ticketId', label: 'Ticket ที่เกี่ยวข้อง', col: 'col-md-4' },
        { id: 'file', label: 'แนบหลักฐาน', type: 'file', col: 'col-md-6' },
        { id: 'notes', label: 'หมายเหตุ', type: 'textarea', rows: 2, col: 'col-md-6' }
      ],
      onSubmit: function (v) {
        var fn = BR_ACTION_FN[v.action] || 'assignAsset';
        var up = (v.file && v.file.files && v.file.files[0]) ? uploadFileInput(v.file, 'borrow') : Promise.resolve(null);
        return up.then(function (res) {
          return callServer(fn, { assetId: v.assetId, toUser: v.toUser, toEmail: v.toEmail, dueDate: v.dueDate, department: v.department, location: v.location, condition: v.condition, ticketId: v.ticketId, notes: v.notes, evidence: res ? res.url : '' });
        }).then(function (m) { toast(m, 'success'); loadModule('borrow'); });
      }
    });
  }

  function brFindLoan(id) { return (BORROW_DATA.onLoan || []).filter(function (x) { return x.id === id; })[0] || {}; }
  function brReturn(id) {
    var r = brFindLoan(id);
    showFormModal({
      title: 'รับคืน: ' + (r.code || id), submitLabel: 'บันทึกการคืน', size: 'md',
      fields: [
        { id: 'condition', label: 'สภาพทรัพย์สินตอนคืน', type: 'select', options: ['ปกติ/ใช้งานได้', 'ชำรุดเล็กน้อย', 'ชำรุด/ต้องซ่อม'], value: 'ปกติ/ใช้งานได้', col: 'col-12' },
        { id: 'location', label: 'จัดเก็บที่', value: 'คลัง IT', col: 'col-12' },
        { id: 'notes', label: 'หมายเหตุ', type: 'textarea', rows: 2, col: 'col-12' }
      ],
      onSubmit: function (v) { return callServer('returnAsset', { assetId: id, condition: v.condition, location: v.location, notes: v.notes }).then(function (m) { toast(m, 'success'); loadModule('borrow'); }); }
    });
  }

  function brPrintSlip(id) {
    var r = brFindLoan(id); if (!r.id) return;
    var esc = function (s) { return String(s == null ? '' : s).replace(/[<>&]/g, ' '); };
    var org = (typeof ORG_NAME !== 'undefined' ? ORG_NAME : '');
    var w = window.open('', '_blank', 'width=720,height=800');
    if (!w) { toast('เบราว์เซอร์บล็อกหน้าต่างพิมพ์ กรุณาอนุญาต popup', 'warning'); return; }
    var row = function (k, v) { return '<tr><td class="k">' + k + '</td><td>' + esc(v || '-') + '</td></tr>'; };
    var html = '<html><head><meta charset="utf-8"><title>ใบยืมทรัพย์สิน ' + esc(r.code || r.id) + '</title>' +
      '<style>body{font-family:"Sarabun",Arial,sans-serif;padding:32px;color:#222}h2{text-align:center;margin:0 0 4px}' +
      '.org{text-align:center;color:#555;margin-bottom:20px}table{width:100%;border-collapse:collapse;margin-bottom:24px}' +
      'td{border:1px solid #999;padding:8px 10px;font-size:15px}.k{background:#f2f2f2;width:32%;font-weight:600}' +
      '.sign{margin-top:48px;display:flex;justify-content:space-around;text-align:center}.sign div{width:40%}' +
      '.line{border-top:1px solid #333;margin-top:48px;padding-top:6px}</style></head><body>' +
      '<h2>ใบยืมทรัพย์สิน IT</h2><div class="org">' + esc(org) + '</div>' +
      '<table>' + row('รหัสทรัพย์สิน', r.code || r.id) + row('ชื่อทรัพย์สิน', r.name) +
      row('ผู้ยืม/ผู้ถือครอง', r.borrower) + row('แผนก', r.department) + row('สถานที่', r.location) +
      row('วันที่ยืม', r.loanDate) + row('กำหนดคืน', r.loanDue) + '</table>' +
      '<div class="sign"><div><div class="line">ผู้ยืม</div></div><div><div class="line">ผู้ให้ยืม (เจ้าหน้าที่ IT)</div></div></div>' +
      '</body><script>window.onload=function(){window.focus();window.print();}<\/script></html>';
    w.document.write(html); w.document.close();
  }

  // ===== รายงานวิเคราะห์ยืม-คืน =====
  function brChart(id, cfg) { var el = document.getElementById(id); if (!el || typeof Chart === 'undefined') return; BR_CHARTS.push(new Chart(el, cfg)); }
  function brShowAnalytics() {
    var c = BR_CONTAINER; if (!c) return;
    c.innerHTML = '<div class="text-center text-muted py-5"><div class="spinner-border text-primary"></div><div class="mt-2">กำลังคำนวณรายงาน...</div></div>';
    callServer('getBorrowAnalytics').then(function (a) { brRenderAnalytics(c, a); })
      .catch(function (err) { c.innerHTML = '<div class="alert alert-danger">โหลดรายงานไม่สำเร็จ: ' + escapeHtmlJs((err && err.message) || String(err)) + '</div><button class="btn btn-outline-secondary" onclick="loadModule(\'borrow\')">กลับ</button>'; });
  }
  function brRenderAnalytics(c, a) {
    BR_CHARTS.forEach(function (ch) { try { ch.destroy(); } catch (e) {} });
    BR_CHARTS = [];
    var kpi = function (label, value, sub, tone) {
      return '<div class="col-6 col-lg-3"><div class="card h-100"><div class="card-body py-3"><div class="text-muted small">' + label + '</div>' +
        '<div class="fs-4 fw-bold text-' + (tone || 'primary') + '">' + value + '</div>' + (sub ? '<div class="text-muted" style="font-size:.75rem">' + sub + '</div>' : '') + '</div></div></div>';
    };
    var listCard = function (title, arr) {
      var rows = (arr || []).map(function (x) { return '<tr><td>' + escapeHtmlJs(x.label) + '</td><td class="text-end"><b>' + x.value + '</b></td></tr>'; }).join('') || '<tr><td class="text-muted" colspan="2">ไม่มีข้อมูล</td></tr>';
      return '<div class="col-lg-6"><div class="card h-100"><div class="card-body"><h6 class="text-muted">' + title + '</h6><div class="table-responsive"><table class="table table-sm mb-0">' + rows + '</table></div></div></div></div>';
    };
    var html = '<div class="d-flex align-items-center flex-wrap gap-2 mb-3">' +
      '<button class="btn btn-outline-secondary btn-sm" onclick="loadModule(\'borrow\')"><i class="bi bi-arrow-left"></i> กลับ</button>' +
      '<h4 class="text-primary mb-0 ms-2">รายงานวิเคราะห์ยืม-คืน</h4></div>';
    html += '<div class="row g-2 mb-3">' +
      kpi('กำลังถูกยืม', a.currentlyOut, 'รายการ', 'primary') +
      kpi('ค้างคืน', a.overdue, 'เกินกำหนด', a.overdue ? 'danger' : 'success') +
      kpi('ใกล้ครบกำหนด', a.dueSoon, '≤7 วัน', a.dueSoon ? 'warning' : 'success') +
      kpi('ระยะเวลายืมเฉลี่ย', a.avgLoanDurationDays === null ? '-' : a.avgLoanDurationDays + ' วัน', 'จาก ' + a.completedLoans + ' ครั้งที่คืน', 'info') +
      '</div>';
    html += '<div class="row g-3 mb-3"><div class="col-lg-12"><div class="card"><div class="card-body"><h6 class="text-muted">แนวโน้มยืม vs คืน (6 เดือน)</h6><div class="analytics-chart-frame analytics-chart-tall"><canvas id="brChartTrend"></canvas></div></div></div></div></div>';
    html += '<div class="row g-3">' +
      listCard('ผู้ถือครองมากสุด (กำลังยืม)', a.byBorrower) +
      listCard('ตามแผนก (กำลังยืม)', a.byDepartment) +
      listCard('ทรัพย์สินที่ถูกยืมบ่อย', a.mostBorrowed) +
      '<div class="col-lg-6"><div class="card h-100"><div class="card-body"><h6 class="text-muted">สัดส่วนตามแผนก</h6><div class="analytics-chart-frame"><canvas id="brChartDept"></canvas></div></div></div></div>' +
      '</div>';
    c.innerHTML = html;
    brChart('brChartTrend', {
      type: 'bar',
      data: { labels: a.trend.map(function (t) { return t.month; }), datasets: [
        { label: 'ยืม', data: a.trend.map(function (t) { return t.assign; }), backgroundColor: '#2563eb' },
        { label: 'คืน', data: a.trend.map(function (t) { return t.ret; }), backgroundColor: '#22c55e' }
      ] },
      options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
    });
    brChart('brChartDept', {
      type: 'doughnut',
      data: { labels: a.byDepartment.map(function (x) { return x.label; }), datasets: [{ data: a.byDepartment.map(function (x) { return x.value; }), backgroundColor: ['#2563eb', '#0ea5e9', '#14b8a6', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#64748b'] }] },
      options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } } }
    });
  }

  // ===== Maintenance =====
  var MAINT_DATA = null;
  var PM_CONTAINER = null;
  var PM_CHARTS = [];
  var PM_TPL_DATA = null;
  var PM_CAL_MONTH = null; // 'YYYY-MM' ที่แสดงในปฏิทิน

  function pmAssigneeOptions(current) {
    var opts = (MAINT_DATA.assignees || []).map(function (a) { return { value: a.value, label: a.label }; });
    if (current && !opts.some(function (o) { return String(o.value) === String(current); })) opts.unshift({ value: current, label: current + ' (ปัจจุบัน)' });
    return opts;
  }

  function renderMaintenance(container) {
    PM_CONTAINER = container;
    container.innerHTML = '<div class="text-center text-muted py-5">กำลังโหลด...</div>';
    callServer('getMaintenanceModuleData').then(function (d) {
      MAINT_DATA = d;
      var due = d.plans.filter(function (p) { return p.planDays !== null && p.planDays <= 7 && p.planDays >= 0 && p.status !== 'ดำเนินการแล้ว' && p.status !== 'ยกเลิก'; }).length;
      var overdue = d.plans.filter(function (p) { return p.planDays !== null && p.planDays < 0 && p.status !== 'ดำเนินการแล้ว' && p.status !== 'ยกเลิก'; }).length;
      var done = d.plans.filter(function (p) { return p.status === 'ดำเนินการแล้ว'; }).length;
      var html = '<div class="d-flex align-items-center flex-wrap gap-2 mb-3"><h3 class="text-primary mb-0">PM / บำรุงรักษา</h3>';
      html += '<div class="ms-auto d-flex flex-wrap gap-2">';
      if (d.canViewAnalytics) html += '<button class="btn btn-outline-primary" onclick="pmShowAnalytics()"><i class="bi bi-graph-up"></i> วิเคราะห์ผล</button>';
      if (d.canManageTemplates) html += '<button class="btn btn-outline-secondary" onclick="pmManageTemplates()"><i class="bi bi-list-check"></i> เทมเพลต</button>';
      if (d.canEdit) html += '<button class="btn btn-primary" onclick="pmOpenForm()"><i class="bi bi-plus-lg"></i> เพิ่มแผน PM</button>';
      html += '</div></div>';
      html += moduleDashboard([
        mdStat('แผนทั้งหมด', d.plans.length, 'bi-tools', 'blue'),
        mdStat('ใกล้ครบกำหนด', due, 'bi-calendar-event', due ? 'amber' : 'gray'),
        mdStat('เกินกำหนด', overdue, 'bi-alarm', overdue ? 'danger' : 'teal'),
        mdStat('ดำเนินการแล้ว', done, 'bi-check-circle', 'teal')
      ]);
      PM_CAL_MONTH = null;
      html += '<ul class="nav nav-tabs mb-3">' +
        '<li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#pm-list" type="button">รายการ</button></li>' +
        '<li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#pm-cal" type="button">ปฏิทิน</button></li>' +
        '</ul><div class="tab-content">' +
        '<div class="tab-pane fade show active" id="pm-list">' + dataTable(pmTableCfg(d)) + '</div>' +
        '<div class="tab-pane fade" id="pm-cal"><div id="pmCalWrap">' + pmCalendarGrid() + '</div></div></div>';
      container.innerHTML = html;
    });
  }

  function pmChecklistToText(items) { return (items || []).map(function (i) { return (i && i.text !== undefined) ? i.text : i; }).join('\n'); }

  function pmOpenForm() {

  // ---- ปฏิทินรายเดือนแบบ grid ----
  function pmCalendarGrid() {
    var plans = (MAINT_DATA.plans || []).filter(function (p) { return p.planISO; });
    if (!PM_CAL_MONTH) {
      var now = new Date();
      PM_CAL_MONTH = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2);
    }
    var parts = PM_CAL_MONTH.split('-');
    var year = parseInt(parts[0], 10), month = parseInt(parts[1], 10) - 1;
    var byDay = {};
    plans.forEach(function (p) { if (p.planISO.indexOf(PM_CAL_MONTH) === 0) { (byDay[p.planISO] = byDay[p.planISO] || []).push(p); } });
    var first = new Date(year, month, 1);
    var startDow = first.getDay();
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var monthName = new Date(year, month, 1).toLocaleDateString('th-TH', { year: 'numeric', month: 'long' });
    var dows = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
    var html = '<div class="d-flex align-items-center justify-content-center gap-3 mb-2">' +
      '<button class="btn btn-sm btn-outline-secondary" onclick="pmCalMove(-1)"><i class="bi bi-chevron-left"></i></button>' +
      '<h5 class="mb-0">' + escapeHtmlJs(monthName) + '</h5>' +
      '<button class="btn btn-sm btn-outline-secondary" onclick="pmCalMove(1)"><i class="bi bi-chevron-right"></i></button></div>';
    html += '<div class="table-responsive"><table class="table table-bordered text-center align-top mb-0" style="table-layout:fixed">';
    html += '<thead><tr>' + dows.map(function (d) { return '<th class="small text-muted">' + d + '</th>'; }).join('') + '</tr></thead><tbody><tr>';
    for (var i = 0; i < startDow; i++) html += '<td style="background:#fafafa"></td>';
    for (var day = 1; day <= daysInMonth; day++) {
      var iso = year + '-' + ('0' + (month + 1)).slice(-2) + '-' + ('0' + day).slice(-2);
      var cell = '<div class="small text-muted">' + day + '</div>';
      (byDay[iso] || []).forEach(function (p) {
        var tone = p.status === 'ดำเนินการแล้ว' ? 'bg-success' : (p.status === 'ยกเลิก' ? 'bg-secondary' : (p.planDays !== null && p.planDays < 0 ? 'bg-danger' : 'bg-primary'));
        cell += '<div class="badge ' + tone + ' d-block text-truncate mb-1" style="cursor:pointer;max-width:100%" title="' + escapeHtmlJs(p.assetName || p.assetId) + '" onclick="pmDetail(\'' + p.id + '\')">' + escapeHtmlJs(p.assetName || p.assetId) + '</div>';
      });
      html += '<td style="height:88px;vertical-align:top">' + cell + '</td>';
      if ((startDow + day) % 7 === 0 && day !== daysInMonth) html += '</tr><tr>';
    }
    html += '</tr></tbody></table></div>';
    return html;
  }
  function pmCalMove(delta) {
    var parts = PM_CAL_MONTH.split('-');
    var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1 + delta, 1);
    PM_CAL_MONTH = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
    var wrap = document.getElementById('pmCalWrap');
    if (wrap) wrap.innerHTML = pmCalendarGrid();
  }

    var kpi = function (label, value, sub, tone) {

  // ===== รายการต้องสั่งซื้อ (Reorder) =====
  function ivReorderList() {

      .map(function (r) {
        var suggested = r.reorderQty > 0 ? r.reorderQty : Math.max((r.min * 2) - r.stock, r.min - r.stock, 1);
        return { id: r.id, name: r.name, category: r.category, unit: r.unit, stock: r.stock, min: r.min, suggested: suggested, unitPrice: r.unitPrice, estCost: Math.round(suggested * (r.unitPrice || 0)) };

  function ivChart(id, cfg) { var el = document.getElementById(id); if (!el || typeof Chart === 'undefined') return; IV_CHARTS.push(new Chart(el, cfg)); }
  function ivShowAnalytics() {
    var c = IV_CONTAINER; if (!c) return;
    c.innerHTML = '<div class="text-center text-muted py-5"><div class="spinner-border text-primary"></div><div class="mt-2">กำลังคำนวณรายงาน...</div></div>';

  }
  function ivRenderAnalytics(c, a) {
    IV_CHARTS.forEach(function (ch) { try { ch.destroy(); } catch (e) {} });
    IV_CHARTS = [];
    var kpi = function (label, value, sub, tone) {
      return '<div class="col-6 col-lg-3"><div class="card h-100"><div class="card-body py-3"><div class="text-muted small">' + label + '</div><div class="fs-4 fw-bold text-' + (tone || 'primary') + '">' + value + '</div>' + (sub ? '<div class="text-muted" style="font-size:.75rem">' + sub + '</div>' : '') + '</div></div></div>';

      '<div class="row g-2"><div class="col-xl-2 col-lg-3"><div class="card stat-card"><div class="card-body p-2"><label class="form-label small fw-semibold">แหล่งข้อมูล</label><select id="uc-source" class="form-select form-select-sm mb-2" onchange="ucSourceChanged()"><option>กำลังโหลด...</option></select><select id="uc-field" class="form-select form-select-sm mb-2"><option value="">— เลือกฟิลด์ —</option></select><button class="btn btn-outline-primary btn-sm w-100 mb-3" onclick="ucAddField()">แทรก Data Field</button><div class="d-grid gap-2"><button class="btn btn-outline-primary btn-sm" onclick="ucAddHeading()">หัวรายงาน</button><button class="btn btn-outline-primary btn-sm" onclick="ucAddText()">กล่องข้อความ</button><button class="btn btn-outline-primary btn-sm" onclick="ucAddTable()">ตาราง</button><button class="btn btn-outline-primary btn-sm" onclick="ucAddRect()">กรอบ/พื้นสี</button><button class="btn btn-outline-primary btn-sm" onclick="document.getElementById(\'uc-image-file\').click()">รูปภาพ/โลโก้</button><input id="uc-image-file" type="file" class="d-none" accept="image/*" onchange="ucAddImage(this)"><button class="btn btn-outline-secondary btn-sm" onclick="ucPreviewData()">ตัวอย่างข้อมูลจริง</button></div><hr><div class="d-flex gap-1"><button class="btn btn-light btn-sm flex-fill" onclick="ucAddPage()">+ หน้า</button><button class="btn btn-light btn-sm flex-fill" onclick="ucDuplicatePage()">คัดลอก</button></div><div class="d-flex align-items-center justify-content-between mt-2"><button class="btn btn-light btn-sm" onclick="ucChangePage(-1)">‹</button><span id="uc-page-label" class="small">หน้า 1/1</span><button class="btn btn-light btn-sm" onclick="ucChangePage(1)">›</button></div><button class="btn btn-outline-danger btn-sm w-100 mt-2" onclick="ucDeletePage()">ลบหน้านี้</button></div></div></div>'+
      '<div class="col-xl-10 col-lg-9"><div class="overflow-auto border rounded bg-secondary-subtle p-3 text-center" style="max-height:calc(100vh - 250px)"><div class="d-inline-block shadow"><canvas id="uc-canvas"></canvas></div></div></div></div>';
    if(!window.fabric){toast('โหลด Fabric.js ไม่สำเร็จ','danger');return;}
    PDF_CANVAS=new fabric.Canvas('uc-canvas',{width:794,height:1123,backgroundColor:'#ffffff',preserveObjectStacking:true,selection:true});
    PDF_PAGES=[];PDF_PAGE_INDEX=0;PDF_HISTORY=[];PDF_FUTURE=[];PDF_CANVAS_TEMPLATE_ID='';
    PDF_CANVAS.on('object:added',ucRemember);PDF_CANVAS.on('object:modified',ucRemember);PDF_CANVAS.on('object:removed',ucRemember);
    PDF_CANVAS.on('selection:created',ucSyncToolbar);PDF_CANVAS.on('selection:updated',ucSyncToolbar);
    document.removeEventListener('keydown',ucKeyboard);document.addEventListener('keydown',ucKeyboard);

  function ucCanvasJson(){return PDF_CANVAS.toJSON(['dataField','templateText']);}
  function ucSaveCurrentPage(){if(!PDF_CANVAS)return;PDF_PAGES[PDF_PAGE_INDEX]={json:ucCanvasJson()};ucUpdatePageLabel();}
  function ucLoadPage(index){if(index<0||index>=PDF_PAGES.length)return;PDF_HISTORY_LOCK=true;PDF_PAGE_INDEX=index;PDF_CANVAS.loadFromJSON(PDF_PAGES[index].json,function(){PDF_CANVAS.setBackgroundColor('#ffffff',function(){PDF_CANVAS.requestRenderAll();});PDF_HISTORY_LOCK=false;ucResetHistory();ucUpdatePageLabel();});}
  function ucUpdatePageLabel(){var el=document.getElementById('uc-page-label');if(el)el.textContent='หน้า '+(PDF_PAGE_INDEX+1)+'/'+Math.max(1,PDF_PAGES.length);}
  function ucAddPage(){ucSaveCurrentPage();PDF_PAGES.push({json:{version:'5.3.0',objects:[],background:'#ffffff'}});ucLoadPage(PDF_PAGES.length-1);}
  function ucDuplicatePage(){ucSaveCurrentPage();PDF_PAGES.splice(PDF_PAGE_INDEX+1,0,{json:JSON.parse(JSON.stringify(PDF_PAGES[PDF_PAGE_INDEX].json))});ucLoadPage(PDF_PAGE_INDEX+1);}
  function ucDeletePage(){if(PDF_PAGES.length<=1){toast('เอกสารต้องมีอย่างน้อย 1 หน้า','warning');return;}PDF_PAGES.splice(PDF_PAGE_INDEX,1);ucLoadPage(Math.min(PDF_PAGE_INDEX,PDF_PAGES.length-1));}
  function ucChangePage(delta){ucSaveCurrentPage();ucLoadPage(PDF_PAGE_INDEX+delta);}
  function ucText(text,opt){opt=opt||{};var o=new fabric.Textbox(text,{left:opt.left||70,top:opt.top||160,width:opt.width||650,fontFamily:'Sarabun',fontSize:opt.size||24,fill:opt.color||'#172b4d',fontWeight:opt.weight||'normal',textAlign:opt.align||'left',lineHeight:1.25,splitByGrapheme:true});if(opt.dataField){o.dataField=opt.dataField;o.templateText=text;}PDF_CANVAS.add(o).setActiveObject(o);PDF_CANVAS.requestRenderAll();}
  function ucAddText(){ucText('ดับเบิลคลิกเพื่อแก้ไขข้อความ');}
  function ucAddHeading(){ucText(ORG_NAME+'\nรายงานสรุปข้อมูล',{top:55,size:34,weight:'bold',align:'center'});}
  function ucAddField(){var key=val('uc-field');if(!key){toast('กรุณาเลือกฟิลด์','warning');return;}ucText('{{'+key+'}}',{dataField:key,width:300});}
  function ucAddRect(){var r=new fabric.Rect({left:80,top:220,width:300,height:120,fill:'#eaf2ff',stroke:'#0d6efd',strokeWidth:1});PDF_CANVAS.add(r).setActiveObject(r);}
  function ucAddTable(){var rows=4,cols=3,w=180,h=44,items=[];for(var r=0;r<rows;r++)for(var col=0;col<cols;col++){items.push(new fabric.Rect({left:col*w,top:r*h,width:w,height:h,fill:r===0?'#dbeafe':'#ffffff',stroke:'#64748b',strokeWidth:1}));items.push(new fabric.Text(r===0?'หัวตาราง '+(col+1):'ข้อมูล',{left:col*w+8,top:r*h+10,fontFamily:'Sarabun',fontSize:16,fill:'#172b4d'}));}var g=new fabric.Group(items,{left:70,top:300});PDF_CANVAS.add(g).setActiveObject(g);}
  function ucAddImage(input){var f=input.files&&input.files[0];if(!f)return;if(f.size>5*1024*1024){toast('รูปต้องไม่เกิน 5 MB','warning');return;}var rd=new FileReader();rd.onload=function(){fabric.Image.fromURL(rd.result,function(img){img.scaleToWidth(Math.min(300,img.width));img.set({left:80,top:200});PDF_CANVAS.add(img).setActiveObject(img);PDF_CANVAS.requestRenderAll();});};rd.readAsDataURL(f);input.value='';}
  function ucDelete(){var o=PDF_CANVAS&&PDF_CANVAS.getActiveObject();if(o){PDF_CANVAS.remove(o);PDF_CANVAS.discardActiveObject().requestRenderAll();}}
  function ucSet(prop,value){var o=PDF_CANVAS&&PDF_CANVAS.getActiveObject();if(!o)return;o.set(prop,value);PDF_CANVAS.requestRenderAll();ucRemember();}
  function ucToggle(prop,on,off){var o=PDF_CANVAS&&PDF_CANVAS.getActiveObject();if(!o)return;ucSet(prop,o.get(prop)===on?off:on);}
  function ucLayer(dir){var o=PDF_CANVAS&&PDF_CANVAS.getActiveObject();if(!o)return;if(dir>0)PDF_CANVAS.bringForward(o);else PDF_CANVAS.sendBackwards(o);PDF_CANVAS.requestRenderAll();ucRemember();}
  function ucDuplicate(){var o=PDF_CANVAS&&PDF_CANVAS.getActiveObject();if(!o)return;o.clone(function(copy){copy.set({left:o.left+20,top:o.top+20});PDF_CANVAS.add(copy).setActiveObject(copy);PDF_CANVAS.requestRenderAll();},['dataField','templateText']);}
  function ucSyncToolbar(){var o=PDF_CANVAS.getActiveObject();if(!o)return;var s=document.getElementById('uc-size'),c=document.getElementById('uc-color'),f=document.getElementById('uc-font');if(s&&o.fontSize)s.value=Math.round(o.fontSize);if(c&&/^#[0-9a-f]{6}$/i.test(o.fill||''))c.value=o.fill;if(f&&o.fontFamily)f.value=o.fontFamily;}
  function ucRemember(){if(PDF_HISTORY_LOCK||!PDF_CANVAS)return;var json=JSON.stringify(ucCanvasJson());if(PDF_HISTORY[PDF_HISTORY.length-1]!==json){PDF_HISTORY.push(json);if(PDF_HISTORY.length>50)PDF_HISTORY.shift();PDF_FUTURE=[];}ucSaveCurrentPage();}
  function ucResetHistory(){PDF_HISTORY=[JSON.stringify(ucCanvasJson())];PDF_FUTURE=[];}
  function ucUndo(){if(PDF_HISTORY.length<2)return;PDF_FUTURE.push(PDF_HISTORY.pop());ucLoadHistory(PDF_HISTORY[PDF_HISTORY.length-1]);}
  function ucRedo(){if(!PDF_FUTURE.length)return;var j=PDF_FUTURE.pop();PDF_HISTORY.push(j);ucLoadHistory(j);}
  function ucLoadHistory(json){PDF_HISTORY_LOCK=true;PDF_CANVAS.loadFromJSON(JSON.parse(json),function(){PDF_CANVAS.requestRenderAll();PDF_HISTORY_LOCK=false;ucSaveCurrentPage();});}
  function ucKeyboard(e){if(!PDF_CANVAS||!document.getElementById('uc-canvas'))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?ucRedo():ucUndo();}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();ucRedo();}else if((e.key==='Delete'||e.key==='Backspace')&&!PDF_CANVAS.getActiveObject()?.isEditing){e.preventDefault();ucDelete();}}
  function ucLoadSources(){callServer('getUniversalReportSources').then(function(d){PDF_SOURCES=d.sources||[];document.getElementById('uc-source').innerHTML=PDF_SOURCES.map(function(s,i){return '<option value="'+i+'">'+escapeHtmlJs(s.label)+'</option>';}).join('');ucSourceChanged();});}
  function ucSourceChanged(){var s=PDF_SOURCES[Number(val('uc-source'))];var el=document.getElementById('uc-field');if(!s||!el)return;el.innerHTML='<option value="">— เลือกฟิลด์ —</option>'+s.fields.map(function(f){return '<option value="'+escapeHtmlJs(f)+'">'+escapeHtmlJs(f)+'</option>';}).join('');}
  function ucPreviewData(){var s=PDF_SOURCES[Number(val('uc-source'))];if(!s)return;callServer('getUniversalReportSample',s.moduleKey,s.sheet).then(function(d){PDF_CANVAS.getObjects().forEach(function(o){if(o.dataField){if(!o.templateText)o.templateText='{{'+o.dataField+'}}';o.set('text',String(d.row[o.dataField]||'-'));}});PDF_CANVAS.requestRenderAll();toast('แสดงข้อมูลตัวอย่างแถวแรกแล้ว','success');});}
  function ucTemplatePayload(){ucSaveCurrentPage();var s=PDF_SOURCES[Number(val('uc-source'))]||{};return {id:PDF_CANVAS_TEMPLATE_ID,moduleKey:s.moduleKey||'',sheet:s.sheet||'',orientation:'portrait',json:JSON.stringify({pages:PDF_PAGES})};}
  function ucSaveTemplate(){showFormModal({title:'บันทึก Template เอกสาร',submitLabel:'บันทึก',size:'md',fields:[{id:'name',label:'ชื่อ Template',required:true,col:'col-12'}],onSubmit:function(v){var p=ucTemplatePayload();p.name=v.name;return callServer('saveCanvasTemplate',p).then(function(d){PDF_CANVAS_TEMPLATE_ID=d.id;toast(d.message,'success');ucLoadTemplateList();});}});}
  function ucLoadTemplateList(){callServer('listCanvasTemplates').then(function(rows){var el=document.getElementById('uc-template');if(!el)return;el._rows=rows;el.innerHTML='<option value="">— Template —</option>'+rows.map(function(t,i){return '<option value="'+i+'">'+escapeHtmlJs(t.name)+' · '+escapeHtmlJs(t.updatedAt)+'</option>';}).join('');});}
  function ucLoadTemplate(){var el=document.getElementById('uc-template'),i=el&&el.value;if(i==='')return;var t=el._rows[Number(i)];try{var data=JSON.parse(t.json);PDF_PAGES=data.pages||[];if(!PDF_PAGES.length)throw new Error('ไม่มีหน้า');PDF_CANVAS_TEMPLATE_ID=t.id;var sourceIndex=PDF_SOURCES.findIndex(function(s){return s.moduleKey===t.moduleKey&&s.sheet===t.sheet;});if(sourceIndex>=0){document.getElementById('uc-source').value=sourceIndex;ucSourceChanged();}ucLoadPage(0);toast('เปิด Template แล้ว','success');}catch(e){toast('Template ไม่ถูกต้อง: '+e.message,'danger');}}
  function ucDeleteTemplate(){var el=document.getElementById('uc-template'),i=el&&el.value;if(i===''){toast('กรุณาเลือก Template','warning');return;}var t=el._rows[Number(i)];showConfirm('ปิดใช้งาน Template “'+t.name+'” ?',function(){callServer('deleteCanvasTemplate',t.id).then(function(m){toast(m,'success');PDF_CANVAS_TEMPLATE_ID='';ucLoadTemplateList();});},{title:'ลบ Template',okLabel:'ลบ',danger:true});}
  function ucRenderPageImages(done){ucSaveCurrentPage();var saved=PDF_PAGE_INDEX,images=[],i=0;function next(){if(i>=PDF_PAGES.length){ucLoadPage(saved);done(images);return;}PDF_HISTORY_LOCK=true;PDF_CANVAS.loadFromJSON(PDF_PAGES[i].json,function(){PDF_CANVAS.discardActiveObject().requestRenderAll();images.push(PDF_CANVAS.toDataURL({format:'png',multiplier:1.5}));PDF_HISTORY_LOCK=false;i++;next();});}next();}
  function ucExport(btn){if(!PDF_CANVAS)return;var old=btn.innerHTML;btn.disabled=true;btn.innerHTML='กำลังสร้าง...';var ready=document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve();ready.then(function(){ucRenderPageImages(function(images){callServer('generateCanvasPdf',{title:'รายงานออกแบบ',orientation:'portrait',images:images}).then(function(d){toast('สร้าง PDF '+d.pages+' หน้าแล้ว','success');window.open(d.url,'_blank');}).finally(function(){btn.disabled=false;btn.innerHTML=old;});});});}
  function reportModuleCard(m) {
    var rows = '';
    if (m.fields && m.fields.length) {
      rows = '<div class="table-responsive mt-2" style="max-height:220px"><table class="table table-sm mb-0"><thead><tr>' +
        m.fields.map(function (f) { return '<th>' + escapeHtmlJs(f) + '</th>'; }).join('') + '</tr></thead><tbody>';
      if (!m.rows.length) rows += '<tr><td colspan="' + m.fields.length + '" class="text-muted">ยังไม่มีข้อมูล</td></tr>';
      else rows += m.rows.map(function (r) {
        return '<tr>' + m.fields.map(function (f) { return '<td><small>' + escapeHtmlJs(r[f] || '') + '</small></td>'; }).join('') + '</tr>';
      }).join('');
      rows += '</tbody></table></div>';
    } else {
      rows = '<div class="small text-muted mt-2">โมดูลนี้เป็นหน้าสรุป ไม่มีชีตข้อมูลหลักโดยตรง</div>';
    }
    var openBtn = m.canOpen ? '<button class="btn btn-sm btn-outline-primary mt-3" onclick="loadModule(\'' + m.key + '\')">เปิดโมดูล</button>' : '';
    return '<div class="col-12 col-xl-6"><div class="card stat-card h-100"><div class="card-body">' +
      '<div class="d-flex align-items-start gap-2"><div><h6 class="mb-1">' + escapeHtmlJs(m.label) + '</h6>' +
      '<div class="small text-muted">' + escapeHtmlJs(m.description || '') + '</div></div>' +
      '<span class="badge bg-primary ms-auto">' + escapeHtmlJs(m.total || 0) + ' รายการ</span></div>' +
      '<div class="small text-muted mt-2">Sheet: ' + escapeHtmlJs(m.sheet || '-') + '</div>' + rows + openBtn +
      '</div></div></div>';
  }

  // ===== Users =====
  function renderUsers(container) {
    container.innerHTML = '<div class="text-center text-muted py-5">กำลังโหลด...</div>';
    callServer('getUsersModuleData').then(function (d) {
      var active = d.users.filter(function (u) { return String(u.status).toLowerCase() === 'active'; }).length;
      var html = '<h3 class="text-primary mb-3">Users</h3>';
      html += moduleDashboard([
        mdStat('ผู้ใช้ทั้งหมด', d.users.length, 'bi-people', 'blue'),
        mdStat('Active', active, 'bi-person-check', 'teal'),
        mdStat('Inactive', d.users.length - active, 'bi-person-x', d.users.length - active ? 'amber' : 'gray'),
        mdStat('บทบาท', d.roles.length, 'bi-shield-check', 'blue')
      ]);
      if (d.canEdit) {
        html += '<div class="card stat-card mb-3"><div class="card-body"><h6>เพิ่มผู้ใช้งาน</h6><div class="row g-2">' +
          fld('usr-name', 'ชื่อ-สกุล *', 'text', 'col-md-3') +
          fld('usr-username', 'Username *', 'text', 'col-md-2') +
          fld('usr-email', 'Email สำหรับ MFA *', 'email', 'col-md-3') +
          fld('usr-employee', 'รหัสพนักงาน', 'text', 'col-md-2') +
          fld('usr-dept', 'หน่วยงาน', 'text', 'col-md-2') +
          sel('usr-role', 'บทบาท *', optPairs(d.roles, 'value', 'label'), 'col-md-2') +
          fld('usr-supervisor', 'Supervisor Email', 'email', 'col-md-2') +
          '</div><button class="btn btn-primary mt-3" onclick="usrSave()">เพิ่มผู้ใช้</button></div></div>';
      }
      html += usrTable(d.users, d.canEdit);
      html += lineUserTable(d.lineUsers || [], d.canEdit);
      container.innerHTML = html;
    });
  }
  function usrSave() {
    var form = { name: val('usr-name'), username: val('usr-username'), email: val('usr-email'), employeeCode: val('usr-employee'), dept: val('usr-dept'),
      role: val('usr-role'), supervisor: val('usr-supervisor') };
    callServer('addSystemUser', form).then(function (m) { toast(m); loadModule('users'); });
  }
  function usrStatus(id, status) {
    showConfirm('ปรับสถานะผู้ใช้งานเป็น ' + status + '?',
      function () { callServer('setSystemUserStatus', id, status).then(function (m) { toast(m); loadModule('users'); }); });
  }
  function usrTable(rows, canEdit) {
    if (!rows.length) return '<div class="alert alert-secondary">ยังไม่มีผู้ใช้งาน</div>';
    var body = rows.map(function (r) {
      var next = String(r.status).toLowerCase() === 'active' ? 'Inactive' : 'Active';
      var act = '';
      if (canEdit) {
        act += '<button class="btn btn-sm btn-outline-primary me-1 mb-1" onclick="usrSetPassword(\'' + escapeHtmlJs(r.username) + '\')">ตั้งรหัสผ่าน</button>';
        act += '<button class="btn btn-sm btn-outline-success me-1 mb-1" onclick="usrSetEmployeeCode(\'' +
          r.id + '\',\'' + escapeHtmlJs(r.employeeCode || '').replace(/'/g, "\\'") + '\')">รหัสพนักงาน</button>';
        act += '<button class="btn btn-sm btn-outline-secondary mb-1" onclick="usrStatus(\'' + r.id + '\',\'' + next + '\')">' + next + '</button>';
      }
      return '<tr><td>' + escapeHtmlJs(r.name) + '</td><td>' + escapeHtmlJs(r.username || '-') + '</td><td>' + escapeHtmlJs(r.employeeCode || '-') + '</td><td>' + escapeHtmlJs(r.email) + '</td><td>' + escapeHtmlJs(r.dept || '-') + '</td>' +
        '<td>' + escapeHtmlJs(r.roleLabel || r.role) + '</td><td>' + itStatusBadge(r.status) + '</td><td>' + act + '</td></tr>';
    }).join('');
    return tableWrap('<tr><th>ชื่อ</th><th>Username</th><th>รหัสพนักงาน</th><th>Email/MFA</th><th>หน่วยงาน</th><th>บทบาท</th><th>สถานะ</th><th></th></tr>', body);
  }
  function usrSetPassword(username) {
    showFormModal({ title: 'ตั้งรหัสผ่าน: ' + username, submitLabel: 'บันทึก', size: 'md',
      fields: [{ id: 'pw', label: 'ข้อความรหัสผ่านใหม่ (อย่างน้อย 12 ตัว)', type: 'password', required: true, col: 'col-12' }],
      onSubmit: function (v) { return callServer('setUserPassword', username, v.pw).then(function (m) { toast(m, 'success'); }); } });
  }
  function usrSetEmployeeCode(userId, currentCode) {
    showFormModal({ title: 'กำหนดรหัสพนักงาน', submitLabel: 'บันทึก', size: 'md',
      fields: [{ id: 'employeeCode', label: 'รหัสพนักงาน', value: currentCode || '', required: true, col: 'col-12' }],
      onSubmit: function (v) {
        return callServer('updateSystemUserEmployeeCode', userId, v.employeeCode)
          .then(function (m) { toast(m, 'success'); loadModule('users'); });
      } });
  }
  function lineUserTable(rows, canEdit) {
    var html = '<div class="card stat-card mt-3"><div class="card-body"><h6 class="mb-3">' +
      '<i class="bi bi-line text-success"></i> บัญชี LINE ที่เชื่อมระบบ (' + rows.length + ')</h6>';
    if (!rows.length) return html + '<div class="alert alert-secondary mb-0">ยังไม่มีผู้ใช้ LINE Login</div></div></div>';
    var body = rows.map(function (r) {
      var avatar = r.pictureUrl
        ? '<img src="' + escapeHtmlJs(r.pictureUrl) + '" alt="" style="width:34px;height:34px;border-radius:50%;object-fit:cover" class="me-2">'
        : '';
      var actions = '';
      if (canEdit) {
        if (r.linkStatus !== 'Active') actions += '<button class="btn btn-sm btn-outline-success me-1" onclick="lineUserStatus(\'' + r.lineUserId + '\',\'Active\')">เปิดใช้</button>';
        if (r.linkStatus !== 'Suspended') actions += '<button class="btn btn-sm btn-outline-warning me-1" onclick="lineUserStatus(\'' + r.lineUserId + '\',\'Suspended\')">ระงับ</button>';
        actions += '<button class="btn btn-sm btn-outline-danger" onclick="lineUserStatus(\'' + r.lineUserId + '\',\'Unlinked\')">ยกเลิกการผูก</button>';
      }
      return '<tr><td>' + avatar + '<b>' + escapeHtmlJs(r.fullName || r.displayName || '-') + '</b><br><small class="text-muted">' +
        escapeHtmlJs(r.maskedId) + '</small></td><td>' + escapeHtmlJs(r.employeeCode || '-') + '</td><td>' +
        escapeHtmlJs(r.department || '-') + '</td><td>' + itStatusBadge(r.linkStatus || 'Pending') + '</td><td>' +
        escapeHtmlJs(r.friendStatus || 'Unknown') + '</td><td>' + escapeHtmlJs(r.lastLoginAt || '-') + '</td><td>' + actions + '</td></tr>';
    }).join('');
    return html + tableWrap('<tr><th>ผู้ใช้ LINE</th><th>รหัสพนักงาน</th><th>หน่วยงาน</th><th>สถานะ</th><th>OA</th><th>Login ล่าสุด</th><th></th></tr>', body) + '</div></div>';
  }
  function lineUserStatus(lineUserId, status) {
    showConfirm('ปรับสถานะบัญชี LINE เป็น ' + status + '?', function () {
      return callServer('setLineUserStatus', lineUserId, status)
        .then(function (m) { toast(m, 'success'); loadModule('users'); });
    });
  }

  // ===== Settings =====
  var SETTINGS_DATA = null;
  function renderSettings(container) {
    container.innerHTML = '<div class="text-center text-muted py-5">กำลังโหลด...</div>';
    callServer('getSettingsModuleData').then(function (d) {
      SETTINGS_DATA = d;
      var html = '<h3 class="text-primary mb-3">Settings</h3>';
      html += moduleDashboard([
        mdStat('ค่าตั้งค่า', d.settings.length, 'bi-gear', 'blue'),
        mdStat('แก้ผ่านหน้านี้ได้', d.allowedKeys.length, 'bi-pencil-square', 'teal'),
        mdStat('กลุ่ม', Array.from(new Set(d.settings.map(function (s) { return s.group || '-'; }))).length, 'bi-folder', 'blue'),
        mdStat('Secret', 'ไม่แสดง', 'bi-shield-lock', 'gray')
      ]);
      html += setBrandingCard(d);
      html += setSchemaDesignerCard(d.schemaDesigner, d.canEdit);
      html += '<h5 class="text-primary mt-4 mb-2"><i class="bi bi-sliders"></i> ค่าระบบ</h5>';

      html += '<div id="recycle-bin" class="mt-4"></div>';
      container.innerHTML = html;
      setSchemaDesignerInit();
      loadRecycleBin();

  // การ์ดแบรนด์/โลโก้องค์กร
  function setBrandingCard(d) {
    var logo = d.logoUrl
      ? '<img src="' + escapeHtmlJs(d.logoUrl) + '" alt="logo" style="width:64px;height:64px;object-fit:contain;border-radius:14px;border:1px solid #e2e8f0;background:#fff" onerror="this.style.display=\'none\'">'
      : '<div style="width:64px;height:64px;border-radius:14px;background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.3rem">กช</div>';
    var controls = d.canEdit
      ? '<div class="ms-auto d-flex gap-2 align-items-center">' +
          '<input id="logo-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml" class="form-control form-control-sm" style="max-width:240px" onchange="logoUpload()">' +
          (d.logoUrl ? '<button class="btn btn-sm btn-outline-danger" onclick="logoRemove()"><i class="bi bi-trash"></i> นำออก</button>' : '') +
        '</div>'
      : '';
    return '<div class="card stat-card mb-3"><div class="card-body d-flex align-items-center gap-3 flex-wrap">' +
      logo +
      '<div><h6 class="mb-1"><i class="bi bi-image"></i> โลโก้องค์กร</h6>' +
      '<div class="small text-muted">แสดงบนหน้าหลังบ้านและหน้าแจ้งซ่อม · รองรับ PNG/JPG/GIF/WEBP/SVG ≤ 2 MB</div></div>' +
      controls + '</div></div>';
  }
  function logoUpload() {
    var el = document.getElementById('logo-file');
    if (!el || !el.files || !el.files[0]) return;
    var f = el.files[0];
    if (f.size > 2 * 1024 * 1024) { toast('ไฟล์โลโก้ต้องไม่เกิน 2 MB', 'warning'); return; }
    var reader = new FileReader();
    reader.onload = function () {
      callServer('uploadOrgLogo', { base64: reader.result.split(',')[1], filename: f.name, mimeType: f.type })
        .then(function () { toast('อัปเดตโลโก้แล้ว — รีโหลดหน้าเพื่อแสดงผลทุกจุด', 'success'); loadModule('settings'); });
    };
    reader.readAsDataURL(f);
  }
  function logoRemove() {
    showConfirm('นำโลโก้ออกและกลับไปใช้ตัวอักษรเริ่มต้น?',
      function () { callServer('removeOrgLogo').then(function (m) { toast(m); loadModule('settings'); }); },
      { danger: true, okLabel: 'นำออก' });
  }

  // ตัวออกแบบโครงสร้างตาราง — เพิ่ม/แก้ชื่อ/ชนิดข้อมูล/ลบฟิลด์รายโมดูล
  var SETTINGS_SCHEMA_MODULE = 'ticket';
  var SETTINGS_SCHEMA_SHEET = '';

  function setSchemaDesignerCard(schema, canEdit) {
    if (!schema || schema.error || !schema.modules) {
      return '<div class="alert alert-warning"><b>ไม่สามารถโหลดตัวออกแบบโครงสร้างตาราง</b><div class="small">' +
        escapeHtmlJs(schema && schema.error ? schema.error : 'ไม่พบข้อมูล schema') + '</div></div>';
    }
    var tableCount = schema.modules.reduce(function (n, m) { return n + (m.tables || []).length; }, 0);
    var customCount = schema.modules.reduce(function (n, m) {
      return n + (m.tables || []).reduce(function (x, t) {
        return x + (t.fields || []).filter(function (f) { return !f.isSystem; }).length;
      }, 0);
    }, 0);
    var moduleOptions = schema.modules.map(function (m) {
      return '<option value="' + escapeHtmlJs(m.key) + '">' + escapeHtmlJs(m.group + ' · ' + m.label) + '</option>';
    }).join('');
    var guidance = (schema.guidance || []).map(function (x) {
      return '<li>' + escapeHtmlJs(x) + '</li>';
    }).join('');
    return '<div class="card stat-card mt-4 mb-3 border-primary"><div class="card-body">' +
      '<div class="d-flex flex-wrap gap-2 align-items-start mb-3"><div>' +
      '<h5 class="text-primary mb-1"><i class="bi bi-table"></i> ตัวออกแบบฟิลด์ทุกโมดูล</h5>' +
      '<div class="small text-muted">จัดการคอลัมน์จริงใน Google Sheet พร้อมรูปแบบข้อมูลและ Data validation</div></div>' +
      '<div class="ms-auto d-flex gap-2"><span class="badge bg-primary">' + tableCount + ' ตาราง</span>' +
      '<span class="badge bg-info text-dark">' + customCount + ' ฟิลด์เพิ่มเอง</span></div></div>' +
      '<div class="alert alert-light border py-2"><ul class="small mb-0 ps-3">' + guidance + '</ul></div>' +
      '<div class="row g-2 align-items-end">' +
      '<div class="col-lg-5"><label class="form-label">โมดูล</label><select id="set-schema-module" class="form-select" onchange="setSchemaModuleChanged()">' +
      moduleOptions + '</select></div>' +
      '<div class="col-lg-4"><label class="form-label">ตารางข้อมูล</label><select id="set-schema-sheet" class="form-select" onchange="setSchemaTableChanged()"></select></div>' +
      '<div class="col-lg-3 d-grid"><button id="set-schema-add" class="btn btn-primary" onclick="setSchemaEditField(\'\')" ' +
      (canEdit ? '' : 'disabled') + '><i class="bi bi-plus-lg"></i> เพิ่มฟิลด์</button></div>' +
      '</div>' +
      '<div id="set-schema-context" class="small text-muted mt-2"></div>' +
      '<div id="set-schema-fields" class="mt-3"></div>' +
      '</div></div>';
  }

  function setSchemaDesignerInit() {
    if (!SETTINGS_DATA || !SETTINGS_DATA.schemaDesigner) return;
    var moduleEl = document.getElementById('set-schema-module');
    if (!moduleEl) return;
    var modules = SETTINGS_DATA.schemaDesigner.modules || [];
    var selected = modules.find(function (m) { return m.key === SETTINGS_SCHEMA_MODULE; });
    if (!selected) selected = modules.find(function (m) { return (m.tables || []).length; }) || modules[0];
    if (!selected) return;
    SETTINGS_SCHEMA_MODULE = selected.key;
    moduleEl.value = selected.key;
    setSchemaModuleChanged();
  }

  function setSchemaModuleChanged() {
    var moduleEl = document.getElementById('set-schema-module');
    var sheetEl = document.getElementById('set-schema-sheet');
    if (!moduleEl || !sheetEl || !SETTINGS_DATA) return;
    SETTINGS_SCHEMA_MODULE = moduleEl.value;
    var module = setSchemaCurrentModule_();
    var tables = module ? (module.tables || []) : [];
    sheetEl.innerHTML = tables.length
      ? tables.map(function (t) { return '<option value="' + escapeHtmlJs(t.sheet) + '">' + escapeHtmlJs(t.label) + '</option>'; }).join('')
      : '<option value="">โมดูลนี้ไม่มีตารางข้อมูลโดยตรง</option>';
    var selected = tables.find(function (t) { return t.sheet === SETTINGS_SCHEMA_SHEET; }) || tables[0];
    SETTINGS_SCHEMA_SHEET = selected ? selected.sheet : '';
    sheetEl.value = SETTINGS_SCHEMA_SHEET;
    setSchemaRenderFields_();
  }

  function setSchemaTableChanged() {
    var sheetEl = document.getElementById('set-schema-sheet');
    SETTINGS_SCHEMA_SHEET = sheetEl ? sheetEl.value : '';
    setSchemaRenderFields_();
  }

  function setSchemaCurrentModule_() {
    var modules = SETTINGS_DATA && SETTINGS_DATA.schemaDesigner ? SETTINGS_DATA.schemaDesigner.modules : [];
    return (modules || []).find(function (m) { return m.key === SETTINGS_SCHEMA_MODULE; }) || null;
  }

  function setSchemaCurrentTable_() {
    var module = setSchemaCurrentModule_();
    return module ? (module.tables || []).find(function (t) { return t.sheet === SETTINGS_SCHEMA_SHEET; }) : null;
  }

  function setSchemaRenderFields_() {
    var box = document.getElementById('set-schema-fields');
    var context = document.getElementById('set-schema-context');
    var addBtn = document.getElementById('set-schema-add');
    if (!box) return;
    var module = setSchemaCurrentModule_();
    var table = setSchemaCurrentTable_();
    if (!table) {
      if (context) context.textContent = module && module.description ? module.description : '';
      if (addBtn) addBtn.disabled = true;
      box.innerHTML = '<div class="alert alert-secondary mb-0">โมดูลนี้เป็นหน้าสรุปหรือรายงาน จึงไม่มีตารางหลักให้ปรับโครงสร้าง</div>';
      return;
    }
    if (context) context.innerHTML = '<b>' + escapeHtmlJs(module.label) + '</b> · Sheet: <code>' +
      escapeHtmlJs(table.sheet) + '</code>' + (table.lockedReason ? ' · <span class="text-danger">' + escapeHtmlJs(table.lockedReason) + '</span>' : '');
    if (addBtn) addBtn.disabled = !SETTINGS_DATA.canEdit || table.locked;
    var fields = table.fields || [];
    if (!fields.length) {
      box.innerHTML = '<div class="alert alert-secondary mb-0">ยังไม่มีฟิลด์ในตารางนี้</div>';
      return;
    }
    var body = fields.map(function (f) {
      var origin = f.isSystem
        ? '<span class="badge bg-secondary">ฟิลด์ระบบ</span>'
        : '<span class="badge bg-info text-dark">เพิ่มเอง</span>';
      var required = f.required ? '<span class="badge bg-warning text-dark ms-1">Required</span>' : '';
      var actions = '';
      if (SETTINGS_DATA.canEdit && f.canEdit) {
        actions += '<button class="btn btn-sm btn-outline-primary me-1" onclick="setSchemaEditField(\'' + _jsArg(f.key) + '\')">' +
          '<i class="bi bi-pencil"></i> แก้ไข</button>';
      }
      if (SETTINGS_DATA.canEdit && f.canDelete) {
        actions += '<button class="btn btn-sm btn-outline-danger" onclick="setSchemaDeleteField(\'' + _jsArg(f.key) + '\')">' +
          '<i class="bi bi-trash"></i> ลบ</button>';
      }
      if (!actions) actions = '<span class="text-muted small">ดูอย่างเดียว</span>';
      return '<tr><td class="text-center">' + f.position + '</td>' +
        '<td><b>' + escapeHtmlJs(f.displayName) + '</b><div><code>' + escapeHtmlJs(f.key) + '</code></div></td>' +
        '<td>' + escapeHtmlJs(f.dataTypeLabel) +
        (f.options ? '<div class="small text-muted">' + escapeHtmlJs(f.options.split('\n').join(', ')) + '</div>' : '') + '</td>' +
        '<td>' + origin + required + '</td><td class="text-nowrap">' + actions + '</td></tr>';
    }).join('');
    box.innerHTML = tableWrap('<tr><th style="width:60px">ลำดับ</th><th>ชื่อฟิลด์ / Field key</th><th>ประเภทข้อมูล</th><th>ประเภทฟิลด์</th><th>จัดการ</th></tr>', body);
  }

  function setSchemaEditField(fieldKey) {
    var table = setSchemaCurrentTable_();
    if (!table || table.locked) return;
    var field = (table.fields || []).find(function (f) { return f.key === fieldKey; }) || null;
    var typeOptions = (SETTINGS_DATA.schemaDesigner.types || []).map(function (t) {
      return { value: t.key, label: t.label };
    });
    showFormModal({
      title: field ? 'แก้ไขฟิลด์: ' + field.displayName : 'เพิ่มฟิลด์ใน ' + table.sheet,
      submitLabel: field ? 'บันทึกการเปลี่ยนแปลง' : 'เพิ่มฟิลด์',
      size: 'lg',
      fields: [
        { id: 'displayName', label: 'ชื่อที่แสดง', type: 'text', value: field ? field.displayName : '', required: true, col: 'col-md-6' },
        { id: 'fieldKey', label: 'Field key / ชื่อคอลัมน์จริง', type: 'text', value: field ? field.key : '', required: true, col: 'col-md-6',
          help: field && field.isSystem ? 'ฟิลด์ระบบเปลี่ยน Field key ไม่ได้ เพื่อไม่ให้โมดูลพัง' : 'ต้องไม่ซ้ำกับคอลัมน์อื่นในตาราง' },
        { id: 'dataType', label: 'ประเภทข้อมูล', type: 'select', value: field ? field.dataType : 'text', options: typeOptions, required: true, col: 'col-md-6' },
        { id: 'required', label: 'กำหนดเป็นฟิลด์จำเป็นใน metadata', type: 'checkbox', value: field ? field.required : false, col: 'col-md-6' },
        { id: 'options', label: 'ตัวเลือก (ใช้เมื่อประเภทเป็น “รายการตัวเลือก”)', type: 'textarea',
          value: field ? field.options : '', rows: 4, col: 'col-12', help: 'หนึ่งค่าต่อบรรทัด หรือคั่นด้วย comma' }
      ],
      onSubmit: function (v) {
        return callServer('saveModuleFieldDefinition', {
          moduleKey: SETTINGS_SCHEMA_MODULE,
          sheetName: SETTINGS_SCHEMA_SHEET,
          originalKey: field ? field.key : '',
          fieldKey: v.fieldKey,
          displayName: v.displayName,
          dataType: v.dataType,
          required: v.required,
          options: v.options
        }).then(function (m) {
          toast(m, 'success');
          loadModule('settings');
        });
      }
    });
  }

  function setSchemaDeleteField(fieldKey) {
    var table = setSchemaCurrentTable_();
    if (!table) return;
    showConfirm('ลบฟิลด์ “' + fieldKey + '” ออกจากตาราง ' + table.sheet + '?',
      function () {
        callServer('deleteModuleField', SETTINGS_SCHEMA_MODULE, SETTINGS_SCHEMA_SHEET, fieldKey, false)
          .then(function (r) {
            if (r && r.requiresConfirm) {
              showConfirm(r.message + ' ยืนยันลบถาวรหรือไม่?',
                function () {
                  callServer('deleteModuleField', SETTINGS_SCHEMA_MODULE, SETTINGS_SCHEMA_SHEET, fieldKey, true)
                    .then(function (done) {
                      toast(done.message, 'success');
                      loadModule('settings');
                    });
                }, { danger: true, okLabel: 'ลบคอลัมน์และข้อมูล', title: 'ยืนยันครั้งสุดท้าย' });
            } else {
              toast(r && r.message ? r.message : 'ลบฟิลด์เรียบร้อย', 'success');
              loadModule('settings');
            }
          });
      }, { danger: true, okLabel: 'ตรวจสอบและลบ', title: 'ยืนยันการลบฟิลด์' });
  }

  // ถังขยะ — รายการที่ถูกลบ (กู้คืนได้)
  function loadRecycleBin() {
    var box = document.getElementById('recycle-bin'); if (!box) return;
    callServerQuiet('listDeletedRecords').then(function (d) {
      if (!d || !d.items.length) {
        box.innerHTML = '<h5 class="text-primary mt-2 mb-2"><i class="bi bi-trash"></i> ถังขยะ</h5>' +
          '<div class="alert alert-light border mb-0"><i class="bi bi-check2-circle text-success"></i> ถังขยะว่าง — ไม่มีรายการที่ถูกลบ</div>';
        return;
      }
      var body = d.items.map(function (r) {
        var act = d.canRestore
          ? '<button class="btn btn-sm btn-outline-success" onclick="binRestore(\'' + _jsArg(r.entity) + '\',\'' + _jsArg(r.id) + '\')"><i class="bi bi-arrow-counterclockwise"></i> กู้คืน</button>'
          : '<span class="text-muted small">—</span>';
        return '<tr><td><span class="badge bg-secondary">' + escapeHtmlJs(r.entityLabel) + '</span></td>' +
          '<td><b>' + escapeHtmlJs(r.name) + '</b><div class="small text-muted">' + escapeHtmlJs(r.id) + '</div></td>' +
          '<td><small>' + escapeHtmlJs(r.deletedAt || '-') + '</small></td>' +
          '<td><small>' + escapeHtmlJs(r.deletedBy || '-') + '</small></td><td>' + act + '</td></tr>';
      }).join('');
      box.innerHTML = '<h5 class="text-primary mt-2 mb-2"><i class="bi bi-trash"></i> ถังขยะ (' + d.count + ')</h5>' +
        '<div class="small text-muted mb-2">รายการที่ถูกลบจากทุกโมดูล สามารถกู้คืนได้</div>' +
        tableWrap('<tr><th>ประเภท</th><th>รายการ</th><th>ลบเมื่อ</th><th>ลบโดย</th><th></th></tr>', body);
    }).catch(function () {
      box.innerHTML = '';
    });
  }
  function binRestore(entity, id) {
    showConfirm('กู้คืนรายการนี้กลับสู่ระบบ?',
      function () {
        callServer('restoreRecord', entity, id).then(function (m) {
          toast(m, 'success'); loadRecycleBin();
        });
      }, { okLabel: 'กู้คืน', title: 'ยืนยันการกู้คืน' });
  }
  function setTable(rows, allowed, canEdit) {
    if (!rows.length) return '<div class="alert alert-secondary">ยังไม่มี Settings</div>';
    var body = rows.map(function (r, i) {
      var editable = canEdit && allowed.indexOf(r.key) > -1;
      var input = editable ? '<input id="set-' + i + '" class="form-control form-control-sm" value="' + escapeHtmlJs(r.value) + '">' : escapeHtmlJs(r.value);
      var act = editable ? '<button class="btn btn-sm btn-outline-primary" onclick="setSave(\'' + r.key + '\',' + i + ')">บันทึก</button>' : '';
      return '<tr><td><b>' + escapeHtmlJs(r.key) + '</b><div class="small text-muted">' + escapeHtmlJs(r.description || '') + '</div></td>' +
        '<td>' + input + '</td><td>' + escapeHtmlJs(r.group || '-') + '</td><td><small>' + escapeHtmlJs(r.updatedAt || '-') + '</small></td><td>' + act + '</td></tr>';
    }).join('');
    return tableWrap('<tr><th>Key</th><th>Value</th><th>Group</th><th>Updated</th><th></th></tr>', body);
  }
  function setSave(key, i) {
    callServer('saveSystemSetting', key, val('set-' + i)).then(function (m) { toast(m); loadModule('settings'); });
  }

  // ===== Tester / QA =====
  var TESTER_STATUSES = null;
  function renderTester(container) {
    container.innerHTML = '<div class="text-center text-muted py-5">กำลังโหลด...</div>';
    callServer('getTesterModuleData').then(function (d) {
      TESTER_STATUSES = d.statuses;
      var pass = d.checks.filter(function (c) { return c.status === 'PASS'; }).length;
      var fail = d.checks.filter(function (c) { return c.status === 'FAIL'; }).length;
      var html = '<div class="d-flex flex-wrap align-items-center mb-3"><h3 class="text-primary mb-0">Tester / QA</h3>' +
        (d.canEdit ? '<button class="btn btn-outline-primary ms-auto" onclick="qaRunLive()">' +
          '<i class="bi bi-activity"></i> ตรวจ Deployment จริง</button>' : '') + '</div>';
      html += moduleDashboard([
        mdStat('Test cases', d.cases.length, 'bi-clipboard-check', 'blue'),
        mdStat('Smoke PASS', pass, 'bi-check-circle', 'teal'),
        mdStat('Smoke FAIL', fail, 'bi-x-circle', fail ? 'danger' : 'gray'),
        mdStat('โมดูลตรวจได้', d.modules.length, 'bi-grid', 'blue')
      ]);
      html += qaGoLiveChecklist(d.goLive);
      html += '<h5 class="text-primary mb-2">Smoke checks</h5>' + qaCheckTable(d.checks);
      if (d.canEdit) {
        html += '<div class="card stat-card my-3"><div class="card-body"><h6>เพิ่ม Test case</h6><div class="row g-2">' +
          sel('qa-module', 'โมดูล *', optPairs(d.modules, 'key', 'label'), 'col-md-3') +
          fld('qa-scenario', 'Scenario *', 'text', 'col-md-5') +
          sel('qa-priority', 'Priority', optList(d.priorities), 'col-md-2') +
          sel('qa-status', 'Status', optList(d.statuses), 'col-md-2') +
          textareaFld('qa-steps', 'Steps', 2, 'col-md-4') +
          textareaFld('qa-expected', 'Expected', 2, 'col-md-4') +
          textareaFld('qa-actual', 'Actual', 2, 'col-md-4') +
          '</div><button class="btn btn-primary mt-3" onclick="qaSave()">เพิ่ม Test case</button></div></div>';
      }
      html += '<h5 class="text-primary mb-2">รายการ Test case</h5>' + qaCaseTable(d.cases, d.canEdit);
      container.innerHTML = html;
    });
  }
  function qaSave() {
    var form = { module: val('qa-module'), scenario: val('qa-scenario'), priority: val('qa-priority'),
      status: val('qa-status'), steps: val('qa-steps'), expected: val('qa-expected'), actual: val('qa-actual') };
    callServer('addQaCase', form).then(function (m) { toast(m); loadModule('tester'); });
  }
  function qaResult(id) {
    showFormModal({ title: 'บันทึกผลทดสอบ', submitLabel: 'บันทึก', size: 'md',
      fields: [
        { id: 'status', label: 'สถานะ', type: 'select', placeholder: false, options: (TESTER_STATUSES || ['PASS', 'FAIL', 'BLOCKED', 'PENDING']), value: 'PASS', col: 'col-12' },
        { id: 'actual', label: 'Actual result', type: 'textarea', rows: 2, col: 'col-12' }
      ],
      onSubmit: function (v) { return callServer('updateQaCaseResult', id, v.status, v.actual).then(function (m) { toast(m); loadModule('tester'); }); } });
  }
  function qaRunLive() {
    callServer('runLiveHealthCheckNow').then(function (r) {
      var failed = (r.checks || []).filter(function (c) { return c.status === 'FAIL'; }).length;
      toast('Live health ' + r.status + ' · ไม่ผ่าน ' + failed + ' รายการ',
        failed ? 'danger' : 'success');
      loadModule('tester');
    });
  }
  function qaGoLiveChecklist(g) {
    if (!g || !g.items) return '';
    var tone = g.overallStatus === 'PASS' ? 'success' : (g.overallStatus === 'BLOCKED' ? 'danger' : 'warning text-dark');
    var icon = g.overallStatus === 'PASS' ? 'bi-rocket-takeoff' : (g.overallStatus === 'BLOCKED' ? 'bi-shield-exclamation' : 'bi-exclamation-triangle');
    var actions = '<button class="btn btn-outline-primary btn-sm" onclick="qaRunLive()"><i class="bi bi-activity"></i> ตรวจ Deployment จริง</button>' +
      '<button class="btn btn-outline-secondary btn-sm" onclick="loadModule(\'settings\')"><i class="bi bi-sliders"></i> Settings</button>' +
      '<button class="btn btn-outline-secondary btn-sm" onclick="loadModule(\'backup\')"><i class="bi bi-database-check"></i> Backup</button>' +
      '<button class="btn btn-outline-secondary btn-sm" onclick="loadModule(\'notification\')"><i class="bi bi-line"></i> LINE Queue</button>';
    var next = (g.nextActions || []).length
      ? '<div class="alert alert-light border py-2 mb-3"><div class="fw-bold small mb-1">สิ่งที่ควรปิดก่อนประกาศใช้งาน</div>' +
        '<ul class="small mb-0 ps-3">' + g.nextActions.map(function (x) { return '<li>' + escapeHtmlJs(x) + '</li>'; }).join('') + '</ul></div>'
      : '<div class="alert alert-success py-2 mb-3"><i class="bi bi-check-circle"></i> ไม่มี blocker จาก checklist นี้</div>';
    var body = g.items.map(function (r) {
      var action = '';
      if (r.action === 'runLive') {
        action = '<button class="btn btn-sm btn-outline-primary" onclick="qaRunLive()">ตรวจ</button>';
      } else if (r.moduleKey) {
        action = '<button class="btn btn-sm btn-outline-secondary" onclick="loadModule(\'' + escapeHtmlJs(r.moduleKey) + '\')">เปิด</button>';
      }
      return '<tr><td><span class="badge bg-light text-dark border">' + escapeHtmlJs(r.category) + '</span></td>' +
        '<td><b>' + escapeHtmlJs(r.title) + '</b><div class="small text-muted">' + escapeHtmlJs(r.detail || '-') + '</div></td>' +
        '<td>' + itStatusBadge(r.status) + '</td><td class="text-end">' + action + '</td></tr>';
    }).join('');
    return '<div class="card stat-card mb-4 border-primary"><div class="card-body">' +
      '<div class="d-flex flex-wrap gap-2 align-items-start mb-3"><div>' +
      '<h5 class="text-primary mb-1"><i class="bi ' + icon + '"></i> Go-live / Release Checklist</h5>' +
      '<div class="small text-muted">ตรวจสถานะก่อนประกาศใช้งานจริง · อัปเดตล่าสุด ' + escapeHtmlJs(g.generatedAt || '-') + '</div></div>' +
      '<div class="ms-auto d-flex flex-wrap gap-2 align-items-center"><span class="badge bg-' + tone + '">' +
      escapeHtmlJs(g.overallLabel || g.overallStatus) + '</span>' + actions + '</div></div>' +
      '<div class="row g-3 mb-3">' +
      '<div class="col-6 col-lg-3"><div class="mini-kpi teal"><div class="mini-icon"><i class="bi bi-check2-circle"></i></div><div><div class="mini-num">' + escapeHtmlJs(g.passed) + '</div><div class="mini-label">PASS</div></div></div></div>' +
      '<div class="col-6 col-lg-3"><div class="mini-kpi ' + (g.warnings ? 'amber' : 'gray') + '"><div class="mini-icon"><i class="bi bi-exclamation-triangle"></i></div><div><div class="mini-num">' + escapeHtmlJs(g.warnings) + '</div><div class="mini-label">WARN</div></div></div></div>' +
      '<div class="col-6 col-lg-3"><div class="mini-kpi ' + (g.blockers ? 'danger' : 'gray') + '"><div class="mini-icon"><i class="bi bi-x-octagon"></i></div><div><div class="mini-num">' + escapeHtmlJs(g.blockers) + '</div><div class="mini-label">BLOCKER</div></div></div></div>' +
      '<div class="col-6 col-lg-3"><div class="mini-kpi blue"><div class="mini-icon"><i class="bi bi-list-check"></i></div><div><div class="mini-num">' + escapeHtmlJs(g.total) + '</div><div class="mini-label">รายการตรวจ</div></div></div></div>' +
      '</div>' + next +
      '<div class="table-responsive" style="max-height:430px"><table class="table table-hover mb-0">' +
      '<thead><tr><th>หมวด</th><th>รายการ</th><th>สถานะ</th><th class="text-end">ทางลัด</th></tr></thead><tbody>' +
      body + '</tbody></table></div></div></div>';
  }
  function qaCheckTable(rows) {
    var body = rows.map(function (r) {
      return '<tr><td>' + escapeHtmlJs(r.name) + '</td><td>' + escapeHtmlJs(r.detail) + '</td><td>' + itStatusBadge(r.status) + '</td></tr>';
    }).join('');
    return tableWrap('<tr><th>โมดูล</th><th>ผลตรวจ</th><th>สถานะ</th></tr>', body);
  }
  function qaCaseTable(rows, canEdit) {
    if (!rows.length) return '<div class="alert alert-secondary">ยังไม่มี Test case</div>';
    var body = rows.map(function (r) {
      var act = canEdit ? '<button class="btn btn-sm btn-outline-primary me-1 mb-1" onclick="qaResult(\'' + r.id + '\')">บันทึกผล</button>' + deleteBtn('qa', r.id, r.scenario || r.id) : '';
      return '<tr><td>' + escapeHtmlJs(r.id) + '</td><td>' + escapeHtmlJs(r.module) + '</td><td>' + escapeHtmlJs(r.scenario) + '</td>' +
        '<td>' + itStatusBadge(r.status) + '</td><td>' + escapeHtmlJs(r.priority || '-') + '</td>' +
        '<td><small>' + escapeHtmlJs(r.testedAt || '-') + '</small></td><td>' + act + '</td></tr>';
    }).join('');
    return tableWrap('<tr><th>Case</th><th>โมดูล</th><th>Scenario</th><th>Status</th><th>Priority</th><th>Tested</th><th></th></tr>', body);
  }
</script>
