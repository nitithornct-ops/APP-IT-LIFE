name: PR Checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check for committed secrets/env files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.[^.]+$)|(^|/)\.dev\.vars$' | grep -v '\.example$'; then
            echo "::error::พบไฟล์ .env/.dev.vars ถูก commit เข้ามาใน repository ห้าม commit ไฟล์ที่มีค่าจริง"
            exit 1
          fi
          echo "ไม่พบไฟล์ secret ที่ไม่ควร commit"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm run test

      # ค่าหลอกสำหรับ build ตรวจสอบใน CI เท่านั้น ไม่ใช่ความลับ และไม่ชี้ไปยังระบบจริงใด ๆ
      #
      # lib/supabase.ts เรียก createClient() ตั้งแต่ระดับ module ถ้าค่าว่างแอปจะพังตั้งแต่บูต
      # หน้าเว็บที่ build ออกมาจึงไม่ redirect ไป /login และ browser smoke test ล้มทั้งชุด
      # ค่าจริงตอน deploy มาจาก GitHub Environment production ซึ่งมีด่าน predeploy บังคับไว้แล้วว่า
      # VITE_SUPABASE_URL ต้องมีและต้องเป็น https — ค่าหลอกตรงนี้จึงไม่ได้ทำให้ด่านนั้นอ่อนลง
      - name: Build
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: ci-anon-key-not-a-real-credential
          VITE_API_BASE_URL: http://localhost:8787
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: npm run build

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: npm run test:e2e

      - name: Migration dry-run gate
        run: npm run dry-run --workspace=packages/migration
