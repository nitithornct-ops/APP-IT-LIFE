name: PR Checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check for committed secrets/env files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.[^.]+$)|(^|/)\.dev\.vars$' | grep -v '\.example$'; then
            echo "::error::พบไฟล์ .env/.dev.vars ถูก commit เข้ามาใน repository ห้าม commit ไฟล์ที่มีค่าจริง"
            exit 1
          fi
          echo "ไม่พบไฟล์ secret ที่ไม่ควร commit"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: npm run test:e2e

      - name: Migration dry-run gate
        run: npm run dry-run --workspace=packages/migration
