name: Staging Live E2E

on:
  workflow_dispatch:
  # ชุดนี้เคยรันเฉพาะตอนกดเอง จึงไปพบว่า locator ไม่ตรง UI เอาตอนจะ deploy แล้ว (3 เคสล้มใน
  # Pre-production QA audit 2026-08-13) — ให้รันกับ PR ที่แตะหน้าจอหรือ API ด้วย เพื่อให้ E2E
  # ที่ตามการ refactor ไม่ทันถูกจับตั้งแต่ตอนรีวิว ไม่ใช่ตอน release gate
  pull_request:
    branches: [master]
    paths:
      - 'apps/web/src/**'
      - 'apps/web/e2e/**'
      - 'apps/web/index.html'
      - 'apps/api/src/**'
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
      - '.github/workflows/staging-e2e.yml'

concurrency:
  # ใช้ staging จริงร่วมกัน จึงต้องต่อคิวทีละงาน ห้ามยกเลิกกลางคันเพราะจะเหลือข้อมูลทดสอบค้างไว้
  group: staging-live-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
      UAT_ADMIN_EMAIL: ${{ secrets.UAT_ADMIN_EMAIL }}
      UAT_ADMIN_PASSWORD: ${{ secrets.UAT_ADMIN_PASSWORD }}
      UAT_ADMIN_TOTP_SECRET: ${{ secrets.UAT_ADMIN_TOTP_SECRET }}
      UAT_REQUESTER_EMAIL: ${{ secrets.UAT_REQUESTER_EMAIL }}
      UAT_TECHNICIAN_EMAIL: ${{ secrets.UAT_TECHNICIAN_EMAIL }}
      UAT_TECHNICIAN_TOTP_SECRET: ${{ secrets.UAT_TECHNICIAN_TOTP_SECRET }}
      UAT_APPROVER_EMAIL: ${{ secrets.UAT_APPROVER_EMAIL }}
      UAT_APPROVER_TOTP_SECRET: ${{ secrets.UAT_APPROVER_TOTP_SECRET }}
      UAT_MANAGER_EMAIL: ${{ secrets.UAT_MANAGER_EMAIL }}
      UAT_MANAGER_TOTP_SECRET: ${{ secrets.UAT_MANAGER_TOTP_SECRET }}
      UAT_VENDOR_CODE: ${{ secrets.UAT_VENDOR_CODE }}
      UAT_VENDOR_EMAIL: ${{ secrets.UAT_VENDOR_EMAIL }}
      UAT_VENDOR_PASSWORD: ${{ secrets.UAT_VENDOR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # Wrangler 4.122+ can terminate local workerd with an empty error after a
      # broken pipe, cascading into ECONNREFUSED failures for the browser suite.
      # The dev script also caps compatibility_date to the newest date supported
      # by this isolated runtime; the deployment configuration remains unchanged.
      - name: Install stable Wrangler for live E2E
        run: npm install --prefix .e2e-tools --no-save --package-lock=false wrangler@4.113.0

      - name: Require a complete staging environment
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY VITE_TURNSTILE_SITE_KEY TURNSTILE_SECRET UAT_ADMIN_EMAIL UAT_ADMIN_PASSWORD UAT_ADMIN_TOTP_SECRET UAT_REQUESTER_EMAIL UAT_TECHNICIAN_EMAIL UAT_TECHNICIAN_TOTP_SECRET UAT_APPROVER_EMAIL UAT_APPROVER_TOTP_SECRET UAT_MANAGER_EMAIL UAT_MANAGER_TOTP_SECRET UAT_VENDOR_CODE UAT_VENDOR_EMAIL UAT_VENDOR_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Staging configuration missing::$name is required"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - run: npx playwright install --with-deps chromium webkit
      - name: Create ephemeral staging configuration
        shell: bash
        run: |
          node -e "const fs=require('fs'); fs.writeFileSync('apps/api/.dev.vars', ['SUPABASE_URL='+process.env.SUPABASE_URL,'SUPABASE_ANON_KEY='+process.env.SUPABASE_ANON_KEY,'SUPABASE_SERVICE_ROLE_KEY='+process.env.SUPABASE_SERVICE_ROLE_KEY,'ALLOWED_ORIGINS=http://localhost:5173','ENVIRONMENT=staging','PUBLIC_APP_URL=http://localhost:5173','PUBLIC_TICKET_FORM_ENABLED=true','TURNSTILE_SECRET='+process.env.TURNSTILE_SECRET,'TURNSTILE_HOSTNAMES=localhost'].join('\n')+'\n')"
          node -e "const fs=require('fs'); fs.writeFileSync('apps/web/.env.local', ['VITE_APP_NAME=LIFE IT Smart Service Center (Staging E2E)','VITE_API_BASE_URL=http://localhost:8787','VITE_SUPABASE_URL='+process.env.SUPABASE_URL,'VITE_SUPABASE_ANON_KEY='+process.env.SUPABASE_ANON_KEY,'VITE_TURNSTILE_SITE_KEY='+process.env.VITE_TURNSTILE_SITE_KEY].join('\n')+'\n')"
      - name: Run all live browser and API flows
        env:
          LIVE_E2E: "1"
          LIVE_DASHBOARD_E2E: "1"
          LIVE_PUBLIC_TRACKING_E2E: "1"
          LIVE_REPORT_E2E: "1"
          LIVE_SETTINGS_E2E: "1"
          LIVE_TASKS_E2E: "1"
          LIVE_TICKET_ACTIONS_E2E: "1"
          LIVE_TICKET_FORM_E2E: "1"
          LIVE_EXTERNAL_UAT_E2E: "1"
        # Live specs mutate one shared staging database. Serial execution keeps a
        # fixture cleanup in one spec from racing a create/read flow in another.
        run: npm run test:e2e --workspace apps/web -- --workers=1
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-e2e-evidence
          path: |
            test-results/
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 14
